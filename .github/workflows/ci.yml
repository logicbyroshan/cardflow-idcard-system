# =============================================================================
# CI Pipeline — Production Grade
# Runs on push & PR to main
# Ensures code is safe before deployment
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Validate Django Project
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      DATABASE_URL: postgres://test_user:test_pass@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/1
      ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies (for pycairo, reportlab, etc)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            pkg-config \
            python3-dev \
            libjpeg-dev \
            libfreetype6-dev \
            libffi-dev
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432; do
            sleep 1
          done

      - name: Run Django system checks
        run: python manage.py check --fail-level WARNING

      - name: Apply migrations
        run: python manage.py migrate --no-input

      - name: Verify no pending migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Test collectstatic
        run: python manage.py collectstatic --no-input

      - name: Run tests
        run: python manage.py test --verbosity=2 --no-input

      - name: Check for hardcoded SECRET_KEY
        run: |
          echo "Checking for hardcoded secrets..."
          if grep -rn "SECRET_KEY\s*=" config/settings.py | grep -v "os.getenv" | grep -v "insecure" | grep -v "#"; then
            echo "ERROR: Hardcoded SECRET_KEY found!"
            exit 1
          fi
          echo "No hardcoded secrets found."

      - name: CI Completed
        run: echo "CI passed successfully!"