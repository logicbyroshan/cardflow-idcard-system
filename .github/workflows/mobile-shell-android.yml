name: Mobile Shell Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release bundles
        run: ./gradlew assembleRelease bundleRelease
      - name: Promote latest APK
        id: promote_latest_apk
        run: |
          # promote_latest_apk:
          echo "ANDROID_KEYSTORE_B64=${{ secrets.ANDROID_KEYSTORE_B64 }}"
          echo "static/website/apk/adarsh-admin.apk"
          echo "static/website/apk/archive/adarsh-admin-${RELEASE_LABEL}.apk"
          echo "static/website/apk/archive/adarsh-admin-${RELEASE_LABEL}.aab"
          echo "mobile_shell_app/android/app/build/outputs/bundle/release/app-release.aab"
