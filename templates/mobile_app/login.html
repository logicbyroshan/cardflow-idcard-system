{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Adarsh IDs">
    <title>Sign In – Adarsh ID Cards</title>

    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="manifest" href="/app/manifest.json">
    <link rel="apple-touch-icon" href="{% static 'mobile/images/icon-192.png' %}">

    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { overscroll-behavior: none; }
        .login-bg {
            background: linear-gradient(160deg, #667eea 0%, #764ba2 50%, #4f46e5 100%);
        }
        .glass-card {
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(20px);
        }
        .input-field {
            transition: border-color .2s, box-shadow .2s;
        }
        .input-field:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,.15);
        }
        .login-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            transition: opacity .2s, transform .1s;
        }
        .login-btn:active { transform: scale(0.98); }
        .login-btn:disabled { opacity: .6; cursor: not-allowed; }
        .error-bar {
            animation: slideIn .2s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        /* Floating bubbles */
        .bubble { position: absolute; border-radius: 50%; background: rgba(255,255,255,.08); }
    </style>
</head>
<body class="bg-gray-100 font-sans" style="overscroll-behavior:none;">
<div class="max-w-[430px] mx-auto min-h-screen flex flex-col login-bg relative overflow-hidden">

    <!-- Background bubbles -->
    <div class="bubble" style="width:220px;height:220px;top:-60px;right:-60px;"></div>
    <div class="bubble" style="width:140px;height:140px;bottom:180px;left:-50px;"></div>
    <div class="bubble" style="width:80px;height:80px;top:40%;right:20px;"></div>

    <!-- Top branding -->
    <div class="flex-1 flex flex-col items-center justify-end pb-6 pt-[env(safe-area-inset-top,32px)] px-8 relative z-10">
        <!-- App Icon -->
        <div class="w-20 h-20 rounded-lg bg-white/20 backdrop-blur flex items-center justify-center mb-4 shadow-xl border border-white/30">
            <i class="fa-solid fa-id-card text-white text-3xl"></i>
        </div>
        <h1 class="text-white text-2xl font-bold tracking-tight">Adarsh ID Cards</h1>
        <p class="text-white/70 text-sm mt-1">Management Portal</p>
    </div>

    <!-- Login Card -->
    <div class="glass-card rounded-t-[16px] px-6 pt-7 pb-[calc(env(safe-area-inset-bottom,0px)+28px)] relative z-10 shadow-2xl">

        <h2 class="text-gray-800 text-xl font-bold mb-1">Welcome back</h2>
        <p class="text-gray-400 text-sm mb-6">Sign in to continue</p>

        <!-- Error bar -->
        <div id="error-bar" class="hidden error-bar bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-lg mb-4 flex items-center gap-2">
            <i class="fa-solid fa-circle-exclamation flex-shrink-0"></i>
            <span id="error-msg">Invalid credentials</span>
        </div>

        <form id="login-form" novalidate>
            <!-- Email -->
            <div class="mb-4">
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Email</label>
                <div class="relative">
                    <div class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
                        <i class="fa-solid fa-envelope text-sm"></i>
                    </div>
                    <input id="email" type="email" autocomplete="email"
                           placeholder="you@example.com"
                           class="input-field w-full pl-10 pr-4 py-3.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-800 placeholder-gray-300">
                </div>
            </div>

            <!-- Password -->
            <div class="mb-6">
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Password</label>
                <div class="relative">
                    <div class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </div>
                    <input id="password" type="password" autocomplete="current-password"
                           placeholder="••••••••"
                           class="input-field w-full pl-10 pr-12 py-3.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-800 placeholder-gray-300">
                    <button type="button" id="toggle-pwd"
                            class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 p-1">
                        <i class="fa-solid fa-eye text-sm" id="pwd-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Submit -->
            <button type="submit" id="login-btn"
                    class="login-btn w-full py-4 rounded-lg text-white font-bold text-base shadow-lg flex items-center justify-center gap-2">
                <i class="fa-solid fa-spinner fa-spin hidden" id="btn-spinner"></i>
                <span id="btn-text">Sign In</span>
            </button>
        </form>

        <!-- Footer hint -->
        <p class="text-center text-gray-400 text-xs mt-5">
            Having trouble? Contact your administrator
        </p>
    </div>
</div>

<script>
(function () {
    // Password toggle
    document.getElementById('toggle-pwd').addEventListener('click', function () {
        var inp = document.getElementById('password');
        var eye = document.getElementById('pwd-eye');
        if (inp.type === 'password') {
            inp.type = 'text';
            eye.className = 'fa-solid fa-eye-slash text-sm';
        } else {
            inp.type = 'password';
            eye.className = 'fa-solid fa-eye text-sm';
        }
    });

    function showError(msg) {
        document.getElementById('error-msg').textContent = msg;
        var bar = document.getElementById('error-bar');
        bar.classList.remove('hidden');
        bar.classList.add('flex');
    }
    function hideError() {
        document.getElementById('error-bar').classList.add('hidden');
        document.getElementById('error-bar').classList.remove('flex');
    }
    function setLoading(on) {
        var btn = document.getElementById('login-btn');
        var sp  = document.getElementById('btn-spinner');
        var txt = document.getElementById('btn-text');
        btn.disabled = on;
        if (on) { sp.classList.remove('hidden'); txt.textContent = 'Signing in…'; }
        else     { sp.classList.add('hidden');    txt.textContent = 'Sign In'; }
    }

    // Get CSRF token from cookie
    function getCsrf() {
        var name = 'csrftoken';
        var val  = document.cookie.split(';').map(function(c){ return c.trim(); })
                   .find(function(c){ return c.startsWith(name + '='); });
        return val ? decodeURIComponent(val.split('=')[1]) : '';
    }

    document.getElementById('login-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        hideError();

        var email    = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;

        if (!email || !password) {
            showError('Please enter your email and password.');
            return;
        }

        setLoading(true);
        try {
            var resp = await fetch('/panel/auth/api/auth/login/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCsrf(),
                },
                body: JSON.stringify({ email: email, password: password, role: null }),
            });

            var data = await resp.json();
            if (data.success) {
                // Always land in the mobile app after login
                window.location.href = '/app/';
            } else {
                showError(data.message || 'Invalid email or password.');
                setLoading(false);
            }
        } catch (err) {
            showError('Network error — please try again.');
            setLoading(false);
        }
    });

    // Auto-fill on Enter in email field → move to password
    document.getElementById('email').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); document.getElementById('password').focus(); }
    });
})();
</script>

<!-- Register PWA Service Worker so Chrome shows install prompt -->
<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
        navigator.serviceWorker.register('/app/sw.js', { scope: '/app/' })
            .catch(function(err) { console.warn('SW registration failed:', err); });
    });
}
</script>
</body>
</html>
