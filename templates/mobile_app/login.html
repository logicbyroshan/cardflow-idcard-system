{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0A92DD">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Adarsh IDs">
    <title>Sign In - Adarsh ID Cards</title>

    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}?v={{ APP_VERSION|urlencode }}">
    <link rel="preload" href="{% static 'css/vendor/webfonts/fa-solid-900.woff2' %}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{% static 'css/vendor/webfonts/fa-regular-400.woff2' %}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{% static 'css/vendor/webfonts/fa-brands-400.woff2' %}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{% static 'css/vendor/fontawesome/all.min.css' %}?v=2">
    <link rel="manifest" href="/app/manifest.json?v={{ APP_VERSION|urlencode }}">
    <link rel="apple-touch-icon" href="{% static 'mobile/images/icon-192.png' %}">
    <script src="{% static 'mobile/js/environment-gate.js' %}?v={{ APP_VERSION|urlencode }}"></script>

    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { overscroll-behavior: none; }
        .login-bg {
            background: linear-gradient(160deg, #0a92dd 0%, #0878b5 55%, #0b6497 100%);
        }
        .glass-card {
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(20px);
        }
        .input-field {
            transition: border-color .2s, box-shadow .2s;
        }
        .input-field:focus {
            outline: none;
            border-color: #0a92dd;
            box-shadow: 0 0 0 3px rgba(10,146,221,.18);
        }
        .login-btn {
            background: linear-gradient(135deg, #0a92dd, #0878b5);
            transition: opacity .2s, transform .1s;
        }
        .login-btn:active { transform: scale(0.98); }
        .login-btn:disabled { opacity: .6; cursor: not-allowed; }
        .error-bar {
            animation: slideIn .2s ease;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        /* Floating bubbles */
        .bubble { position: absolute; border-radius: 8px; background: rgba(255,255,255,.08); }
    </style>
</head>
<body class="bg-gray-100 font-sans" style="overscroll-behavior:none;">
<div class="max-w-[430px] mx-auto min-h-screen flex flex-col login-bg relative overflow-hidden">

    <!-- Background bubbles -->
    <div class="bubble" style="width:220px;height:220px;top:-60px;right:-60px;"></div>
    <div class="bubble" style="width:140px;height:140px;bottom:180px;left:-50px;"></div>
    <div class="bubble" style="width:80px;height:80px;top:40%;right:20px;"></div>

    <!-- Top branding -->
    <div class="flex-1 flex flex-col items-center justify-end pb-6 pt-[env(safe-area-inset-top,32px)] px-8 relative z-10">
        <!-- App Icon -->
        <div class="w-20 h-20 rounded-2xl bg-white/20 backdrop-blur flex items-center justify-center mb-4 shadow-xl border border-white/30">
            <i class="fa-solid fa-id-card text-white text-3xl"></i>
        </div>
        <h1 class="text-white text-2xl font-bold tracking-tight">Adarsh ID Cards</h1>
        <p class="text-white/70 text-sm mt-1">Management Portal</p>
    </div>

    <!-- Login Card -->
    <div class="glass-card rounded-t-3xl px-6 pt-7 pb-[calc(env(safe-area-inset-bottom,0px)+28px)] relative z-10 shadow-2xl">

        <h2 class="text-gray-800 text-xl font-bold mb-1">Welcome back</h2>
        <p class="text-gray-400 text-sm mb-6">Sign in to continue</p>

        <button type="button" id="install-app-btn"
                class="w-full mb-4 py-3 rounded-xl border border-blue-100 bg-blue-50 text-blue-700 text-sm font-bold flex items-center justify-center gap-2">
            <i class="fa-solid fa-mobile-screen-button"></i>
            <span id="install-app-btn-text">Download App</span>
        </button>

        <!-- Error bar -->
        <div id="error-bar" class="hidden error-bar bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-xl mb-4 flex items-center gap-2">
            <i class="fa-solid fa-circle-exclamation flex-shrink-0"></i>
            <span id="error-msg">Invalid credentials</span>
        </div>

        <form id="login-form" novalidate>
            <!-- Email -->
            <div class="mb-4">
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Email</label>
                <div class="relative">
                    <div class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
                        <i class="fa-solid fa-envelope text-sm"></i>
                    </div>
                    <input id="email" type="email" autocomplete="email"
                           placeholder="you@example.com"
                           class="input-field w-full pl-10 pr-4 py-3.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-800 placeholder-gray-300">
                </div>
            </div>

            <!-- Password -->
            <div class="mb-6">
                <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1.5">Password</label>
                <div class="relative">
                    <div class="absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </div>
                    <input id="password" type="password" autocomplete="current-password"
                           placeholder=""
                           class="input-field w-full pl-10 pr-12 py-3.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-800 placeholder-gray-300">
                    <button type="button" id="toggle-pwd"
                            class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 p-1">
                        <i class="fa-solid fa-eye text-sm" id="pwd-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Submit -->
            <button type="submit" id="login-btn"
                    class="login-btn w-full py-4 rounded-xl text-white font-bold text-base shadow-lg flex items-center justify-center gap-2">
                <i class="fa-solid fa-spinner fa-spin hidden" id="btn-spinner"></i>
                <span id="btn-text">Sign In</span>
            </button>
        </form>

        <!-- Footer hint -->
        <p class="text-center text-gray-400 text-xs mt-5">
            Having trouble? Contact your administrator
        </p>
    </div>
</div>

<script>
(function () {
    // Password toggle
    document.getElementById('toggle-pwd').addEventListener('click', function () {
        var inp = document.getElementById('password');
        var eye = document.getElementById('pwd-eye');
        if (inp.type === 'password') {
            inp.type = 'text';
            eye.className = 'fa-solid fa-eye-slash text-sm';
        } else {
            inp.type = 'password';
            eye.className = 'fa-solid fa-eye text-sm';
        }
    });

    function showError(msg) {
        document.getElementById('error-msg').textContent = msg;
        var bar = document.getElementById('error-bar');
        bar.classList.remove('hidden');
        bar.classList.add('flex');
    }
    function hideError() {
        document.getElementById('error-bar').classList.add('hidden');
        document.getElementById('error-bar').classList.remove('flex');
    }
    function setLoading(on) {
        var btn = document.getElementById('login-btn');
        var sp  = document.getElementById('btn-spinner');
        var txt = document.getElementById('btn-text');
        btn.disabled = on;
        if (on) { sp.classList.remove('hidden'); txt.textContent = 'Signing in...'; }
        else     { sp.classList.add('hidden');    txt.textContent = 'Sign In'; }
    }

    function formatActiveDeviceList(devices) {
        if (!Array.isArray(devices) || !devices.length) return '';
        return devices.slice(0, 3).map(function(item) {
            var label = String((item && item.device_label) || 'Unknown device').trim();
            var ip = String((item && item.ip_address) || '').trim();
            return ip ? (label + ' [' + ip + ']') : label;
        }).join(', ');
    }

    var deferredInstallPrompt = null;
    var installBtn = document.getElementById('install-app-btn');
    var installBtnText = document.getElementById('install-app-btn-text');
    var apkDownloadUrl = '{{ MOBILE_ANDROID_APP_DOWNLOAD_URL|default:""|escapejs }}';
    var envGate = window.adarshMobileEnv || null;

    function isNativeShell() {
        if (envGate && typeof envGate.isNativeShell === 'function') {
            return envGate.isNativeShell();
        }
        var cap = window.Capacitor;
        return !!(cap && typeof cap.isNativePlatform === 'function' && cap.isNativePlatform());
    }

    function isStandalonePwa() {
        if (envGate && typeof envGate.isStandalonePwa === 'function') {
            return envGate.isStandalonePwa();
        }
        return window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
    }

    function isIosSafariInstallPath() {
        var ua = navigator.userAgent || '';
        var isIOS = /iPhone|iPad|iPod/i.test(ua);
        var isSafari = /Safari/i.test(ua) && !/CriOS|FxiOS|EdgiOS/i.test(ua);
        return isIOS && isSafari && !isStandalonePwa();
    }

    function refreshInstallBtnState() {
        if (isNativeShell()) {
            installBtn.classList.add('hidden');
            return;
        }
        installBtn.classList.remove('hidden');
        installBtnText.textContent = apkDownloadUrl ? 'Download Android App' : 'Download App';
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
            navigator.serviceWorker.register('/app/sw.js?v={{ APP_VERSION|urlencode }}', { scope: '/app/' }).catch(function () {});
        });
    }

    if (!isNativeShell()) {
        window.addEventListener('beforeinstallprompt', function (e) {
            e.preventDefault();
            deferredInstallPrompt = e;
            refreshInstallBtnState();
        });

        window.addEventListener('appinstalled', function () {
            deferredInstallPrompt = null;
            refreshInstallBtnState();
        });
    }

    installBtn.addEventListener('click', async function () {
        if (isNativeShell()) {
            return;
        }

        if (apkDownloadUrl) {
            window.location.href = apkDownloadUrl;
            return;
        }

        if (deferredInstallPrompt) {
            deferredInstallPrompt.prompt();
            try { await deferredInstallPrompt.userChoice; } catch (e) {}
            deferredInstallPrompt = null;
            refreshInstallBtnState();
            return;
        }

        // If browser cannot show install prompt yet, move user to app root.
        // This lets the browser fulfill install eligibility and show native prompt later.
        window.location.href = '/app/?install=1';
    });

    refreshInstallBtnState();

    // Get CSRF token from cookie
    function getCsrf() {
        var name = 'csrftoken';
        var val  = document.cookie.split(';').map(function(c){ return c.trim(); })
                   .find(function(c){ return c.startsWith(name + '='); });
        return val ? decodeURIComponent(val.split('=')[1]) : '';
    }

    document.getElementById('login-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        hideError();

        var email    = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;

        if (!email || !password) {
            showError('Please enter your email and password.');
            return;
        }

        setLoading(true);
        try {
            var body = { email: email, password: password };
            var resp = await fetch('/app/api/auth/login/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCsrf(),
                },
                body: JSON.stringify(body),
            });

            var data = await resp.json();

            if (!data.success && data.session_limit_hit && data.can_force_logout_other) {
                var deviceText = formatActiveDeviceList(data.active_session_devices);
                var promptText = deviceText
                    ? ('Already logged in on: ' + deviceText + '. Logout other device and continue here?')
                    : 'Already logged in on another mobile. Logout other device and continue here?';

                if (window.confirm(promptText)) {
                    body.force_logout_other = true;
                    resp = await fetch('/app/api/auth/login/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': getCsrf(),
                        },
                        body: JSON.stringify(body),
                    });
                    data = await resp.json();
                }
            }

            if (data.success) {
                // Always land in the mobile app after login
                try {
                    sessionStorage.setItem('adarsh.mobile.justLoggedInAt', String(Date.now()));
                } catch (e) {}
                window.location.replace('/app/');
            } else {
                if (data.no_mobile_access) {
                    window.location.href = '/app/no-access/';
                    return;
                }
                showError(data.message || 'Invalid email or password.');
                setLoading(false);
            }
        } catch (err) {
            showError('Network error  -  please try again.');
            setLoading(false);
        }
    });

    // Auto-fill on Enter in email field -> move to password
    document.getElementById('email').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); document.getElementById('password').focus(); }
    });

    var qs = new URLSearchParams(window.location.search || '');
    if (qs.get('revoked') === '1') {
        showError('Mobile app access was removed. Please contact admin.');
    }
})();
</script>

</body>
</html>
