{% extends "mobile_app/base.html" %}
{% load static %}

{% block title %}Access Denied - Adarsh ID Cards{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-b from-slate-50 via-indigo-50/25 to-sky-50/35 flex items-center justify-center px-6">
    <div class="text-center">
        <div class="w-20 h-20 rounded-full bg-red-50 border border-red-100 flex items-center justify-center mx-auto mb-5 shadow-sm">
            <i class="fa-solid fa-lock text-3xl text-red-400"></i>
        </div>
        <h1 class="text-xl font-bold text-gray-800 mb-2">Access Not Enabled</h1>
        <p class="text-sm text-gray-500 mb-6">Mobile app access has not been enabled for your account. Please contact your administrator.</p>
        <a href="{% url 'mobile_app:mobile_login' %}" class="inline-block px-6 py-3 bg-gradient-to-r from-brand-light to-brand-dark text-white text-sm font-semibold rounded-xl shadow-md hover:shadow-lg transition">
            <i class="fa-solid fa-arrow-left mr-2"></i>Back to Login
        </a>
    </div>
</div>
{% endblock %}
