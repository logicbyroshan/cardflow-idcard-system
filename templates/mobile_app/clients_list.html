{% extends "mobile_app/base.html" %}
{% load static %}

{% block title %}Clients - Adarsh ID Cards{% endblock %}

{% block content %}
<div class="flex flex-col" style="height: 100vh; height: 100dvh;"
     x-data="clientsApp()"
     x-init="loadClients()">

    <!-- Header -->
    <div class="flex-shrink-0 z-40 bg-white shadow-sm">
        <div class="px-4 pt-3 pb-2 bg-gradient-to-r from-brand-light to-brand-dark">
            <!-- Top row: back + title + count -->
            <div class="flex items-center gap-3 mb-2.5">
                <a href="{% url 'mobile_app:home' %}" class="w-8 h-8 rounded-lg bg-white/20 flex items-center justify-center text-white hover:bg-white/30 active:scale-95 transition-all">
                    <i class="fa-solid fa-arrow-left text-sm"></i>
                </a>
                <div class="flex-1">
                    <h1 class="text-white font-bold text-sm">{% if is_admin_staff %}Assigned Clients{% else %}Active Clients{% endif %}</h1>
                    <p class="text-white/70 text-[10px]" x-text="filteredClients.length + ' client(s)'"></p>
                </div>
                <!-- Status filter chips -->
                <div class="flex gap-1">
                    <button @click="filter = 'all'" class="text-[9px] font-bold px-2 py-1 rounded-full transition"
                            :class="filter === 'all' ? 'bg-white text-brand-light' : 'bg-white/20 text-white'">All</button>
                    <button @click="filter = 'active'" class="text-[9px] font-bold px-2 py-1 rounded-full transition"
                            :class="filter === 'active' ? 'bg-white text-brand-light' : 'bg-white/20 text-white'">Active</button>
                </div>
            </div>
            <!-- Two big action tabs -->
            <div class="grid grid-cols-2 gap-2">
                <button @click="targetTab = 'groups'"
                        class="flex items-center justify-center gap-2 py-2 rounded-xl font-semibold text-xs transition-all"
                        :class="targetTab === 'groups' ? 'bg-white text-brand-light shadow' : 'bg-white/15 text-white border border-white/20'">
                    <i class="fa-solid fa-layer-group text-xs"></i>
                    <span>ID Card Groups</span>
                </button>
                <button @click="targetTab = 'tables'"
                        class="flex items-center justify-center gap-2 py-2 rounded-xl font-semibold text-xs transition-all"
                        :class="targetTab === 'tables' ? 'bg-white text-brand-light shadow' : 'bg-white/15 text-white border border-white/20'">
                    <i class="fa-solid fa-gear text-xs"></i>
                    <span>Group Settings</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div x-show="toast.show" x-transition
         class="fixed top-14 inset-x-4 z-[100] px-4 py-2.5 rounded-xl shadow-lg text-white text-xs font-semibold flex items-center gap-2 max-w-sm mx-auto"
         :class="toast.type === 'success' ? 'bg-green-500' : toast.type === 'error' ? 'bg-red-500' : 'bg-gray-700'">
        <i :class="toast.type === 'success' ? 'fa-solid fa-check-circle' : toast.type === 'error' ? 'fa-solid fa-circle-exclamation' : 'fa-solid fa-info-circle'"></i>
        <span x-text="toast.message"></span>
    </div>

    <!-- Client List -->
    <div class="flex-1 overflow-y-auto px-4 py-3">
        <div class="space-y-2">
            <template x-for="c in filteredClients" :key="c.id">
                <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden"
                     :class="c.status !== 'active' ? 'opacity-70' : ''">
                    <div class="flex items-center gap-3 p-3">
                        <!-- Avatar -->
                        <div class="w-11 h-11 rounded-xl flex items-center justify-center text-white font-bold text-sm flex-shrink-0 shadow-sm"
                             :class="c.status === 'active' ? 'bg-gradient-to-br from-sky-400 to-blue-500' : 'bg-gray-300'">
                            <span x-text="(c.name || 'C').substring(0,2).toUpperCase()"></span>
                        </div>
                        <!-- Info — tap to open groups (active only) -->
                        <div class="flex-1 min-w-0 cursor-pointer" @click="c.status === 'active' && openGroups(c.id)">
                            <div class="flex items-center gap-2">
                                <p class="text-sm font-bold text-gray-800 truncate" x-text="c.name"></p>
                                <span class="text-[9px] font-bold px-1.5 py-0.5 rounded-full uppercase"
                                      :class="c.status === 'active' ? 'bg-green-50 text-green-600 border border-green-200' : 'bg-gray-100 text-gray-500'">
                                    <span x-text="c.status"></span>
                                </span>
                            </div>
                            <p class="text-[10px] text-gray-400 mt-0.5">
                                <span x-text="c.tables_count + ' table(s)'"></span>
                                <span class="mx-1">·</span>
                                <span x-text="c.cards_count + ' card(s)'"></span>
                            </p>
                        </div>
                        <!-- Actions -->
                        <div class="flex items-center gap-1 flex-shrink-0">
                            <!-- Open groups (active only) -->
                            <button x-show="c.status === 'active'" @click="openGroups(c.id)"
                                    class="w-8 h-8 rounded-lg flex items-center justify-center active:scale-95 transition-all"
                                    :class="targetTab === 'tables' ? 'bg-amber-50 text-amber-500' : 'bg-indigo-50 text-indigo-500'"
                                    :title="targetTab === 'tables' ? 'Group Settings' : 'ID Card Groups'">
                                <i class="text-xs" :class="targetTab === 'tables' ? 'fa-solid fa-gear' : 'fa-solid fa-layer-group'"></i>
                            </button>
                            <!-- Toggle active/inactive -->
                            <button @click="toggleClient(c)"
                                    class="w-8 h-8 rounded-lg flex items-center justify-center active:scale-95 transition-all"
                                    :class="c.status === 'active' ? 'bg-yellow-50 text-yellow-500' : 'bg-green-50 text-green-500'"
                                    :title="c.status === 'active' ? 'Deactivate' : 'Activate'">
                                <i class="text-xs" :class="c.status === 'active' ? 'fa-solid fa-pause' : 'fa-solid fa-play'"></i>
                            </button>
                            <!-- Delete (super admin only) -->
                            {% if is_super_admin %}
                            <button @click="deleteClient(c)"
                                    class="w-8 h-8 rounded-lg bg-red-50 text-red-400 flex items-center justify-center active:scale-95 transition-all" title="Delete">
                                <i class="fa-solid fa-trash text-xs"></i>
                            </button>
                            {% endif %}
                        </div>
                    </div>
                </div>
            </template>

            <!-- Empty state -->
            <div x-show="filteredClients.length === 0" class="flex items-center justify-center py-16 text-gray-400">
                <div class="text-center">
                    <i class="fa-solid fa-building text-3xl mb-2 block"></i>
                    <p class="text-sm" x-text="filter !== 'all' ? 'No ' + filter + ' clients' : 'No clients found'"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Nav -->
    {% include "mobile_app/partials/bottom_nav.html" %}
</div>

<script>
const CLIENTS_DATA = {{ clients_json|safe }};
const CSRF_TOKEN = document.cookie.split(';').map(c=>c.trim()).find(c=>c.startsWith('csrftoken='))?.split('=')[1] || '{{ csrf_token }}';

function clientsApp() {
    return {
        clients: [],
        filter: 'all',
        targetTab: 'groups',
        loading: false,
        toast: { show: false, message: '', type: 'info' },

        get filteredClients() {
            if (this.filter === 'all') return this.clients;
            return this.clients.filter(c => c.status === this.filter);
        },

        loadClients() {
            this.clients = CLIENTS_DATA;
        },

        openGroups(clientId) {
            const suffix = this.targetTab === 'tables' ? '?tab=tables' : '';
            window.location.href = '/app/clients/' + clientId + '/groups/' + suffix;
        },

        showToast(msg, type='info') {
            this.toast = { show: true, message: msg, type };
            setTimeout(() => { this.toast.show = false; }, 2800);
        },

        async toggleClient(c) {
            const action = c.status === 'active' ? 'deactivate' : 'activate';
            if (!confirm(action.charAt(0).toUpperCase() + action.slice(1) + ' ' + c.name + '?')) return;
            try {
                const res = await fetch('/app/api/client/' + c.id + '/toggle/', {
                    method: 'POST',
                    headers: { 'X-CSRFToken': CSRF_TOKEN, 'Content-Type': 'application/json' },
                });
                const data = await res.json();
                if (data.success) {
                    c.status = data.new_status;
                    this.showToast(data.message, 'success');
                } else {
                    this.showToast(data.message || 'Failed', 'error');
                }
            } catch (e) { this.showToast('Network error', 'error'); }
        },

        async deleteClient(c) {
            if (!confirm('Permanently delete ' + c.name + '? This cannot be undone!')) return;
            try {
                const res = await fetch('/app/api/client/' + c.id + '/delete/', {
                    method: 'POST',
                    headers: { 'X-CSRFToken': CSRF_TOKEN, 'Content-Type': 'application/json' },
                });
                const data = await res.json();
                if (data.success) {
                    this.clients = this.clients.filter(cl => cl.id !== c.id);
                    this.showToast(data.message, 'success');
                } else {
                    this.showToast(data.message || 'Failed', 'error');
                }
            } catch (e) { this.showToast('Network error', 'error'); }
        },
    };
}
</script>
{% endblock %}
