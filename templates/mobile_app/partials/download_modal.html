<!-- Download Progress Modal â€” Bottom Sheet -->
<!-- Blocks all interaction while downloading -->

<div x-show="downloadModal.show"
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-150"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     @click.self="false"
     class="download-modal-backdrop"
     style="display: none;">

    <div class="download-modal-sheet"
         @click.stop
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="translate-y-full"
         x-transition:enter-end="translate-y-0">

        <!-- Handle bar -->
        <div class="download-modal-handle"></div>

        <!-- Header -->
        <div class="download-modal-header">
            <!-- Icon changes based on state -->
            <div class="download-modal-icon"
                 :class="{
                     'preparing': downloadModal.state === 'preparing',
                     'downloading': downloadModal.state === 'downloading',
                     'complete': downloadModal.state === 'complete',
                     'error': downloadModal.state === 'error'
                 }">
                <i :class="{
                    'fa-solid fa-gear fa-spin': downloadModal.state === 'preparing',
                    'fa-solid fa-download': downloadModal.state === 'downloading',
                    'fa-solid fa-check': downloadModal.state === 'complete',
                    'fa-solid fa-xmark': downloadModal.state === 'error'
                }"></i>
            </div>

            <!-- Title -->
            <h3 class="download-modal-title" x-text="downloadModal.title"></h3>

            <!-- Subtitle / Description -->
            <p class="download-modal-subtitle" x-text="downloadModal.subtitle"></p>

            <!-- Items count badge -->
            <div class="download-items-badge" x-show="downloadModal.itemCount > 0">
                <i class="fa-solid fa-id-card"></i>
                <span x-text="downloadModal.itemCount + ' item' + (downloadModal.itemCount > 1 ? 's' : '')"></span>
            </div>
        </div>

        <!-- Progress Bar (shown during preparing/downloading) -->
        <div class="download-modal-progress"
             x-show="downloadModal.state === 'preparing' || downloadModal.state === 'downloading'">

            <div class="download-progress-bar-wrap">
                <div class="download-progress-bar"
                     :class="{ 'indeterminate': downloadModal.progress < 0 }"
                     :style="downloadModal.progress >= 0 ? 'width:' + downloadModal.progress + '%' : ''"></div>
            </div>

            <div class="download-progress-stats">
                <!-- Progress percent -->
                <span class="download-progress-percent"
                      x-text="downloadModal.progress >= 0 ? downloadModal.progress + '%' : 'Processing...'"></span>

                <!-- Estimated time -->
                <span class="download-progress-time"
                      x-show="downloadModal.estimatedTime"
                      x-text="downloadModal.estimatedTime"></span>

                <!-- Size info -->
                <span class="download-progress-size"
                      x-show="downloadModal.sizeInfo"
                      x-text="downloadModal.sizeInfo"></span>
            </div>
        </div>

        <!-- Status message with spinner -->
        <div class="download-modal-status"
             x-show="downloadModal.statusText && (downloadModal.state === 'preparing' || downloadModal.state === 'downloading')">
            <p class="download-status-text">
                <i class="fa-solid fa-circle-notch"></i>
                <span x-text="downloadModal.statusText"></span>
            </p>
        </div>

        <!-- Action Buttons -->
        <div class="download-modal-actions">
            <!-- Cancel button â€” always visible during processing -->
            <button type="button"
                    class="download-btn-cancel"
                    x-show="downloadModal.state !== 'complete'"
                    @click="cancelDownload()"
                    :disabled="downloadModal.cancelling">
                <i class="fa-solid fa-xmark"></i>
                <span x-text="downloadModal.cancelling ? 'Cancelling...' : 'Cancel'"></span>
            </button>

            <!-- Done button â€” shown on complete -->
            <button type="button"
                    class="download-btn-done"
                    x-show="downloadModal.state === 'complete'"
                    @click="closeDownloadModal()">
                <i class="fa-solid fa-check"></i>
                <span>Done</span>
            </button>

            <!-- Close button â€” shown on error -->
            <button type="button"
                    class="download-btn-cancel"
                    x-show="downloadModal.state === 'error'"
                    @click="closeDownloadModal()">
                <i class="fa-solid fa-xmark"></i>
                <span>Close</span>
            </button>
        </div>

    </div>
</div>
