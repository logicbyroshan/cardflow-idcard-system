<!-- Add/Edit Form Bottom Sheet -->
<div
    x-show="showAddForm"
    class="fixed inset-0 z-[70]"
    x-cloak
    data-mobile-overlay-root
>
    <!-- Backdrop -->
    <div
        x-show="showAddForm"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        class="absolute inset-0 bg-black/50 backdrop-blur-sm"
        @click="closeAddForm()"
    ></div>

    <!-- Sheet -->
    <div
        x-show="showAddForm"
        x-transition:enter="transition ease-out duration-400"
        x-transition:enter-start="translate-y-full"
        x-transition:enter-end="translate-y-0"
        x-transition:leave="transition ease-in duration-300"
        x-transition:leave-start="translate-y-0"
        x-transition:leave-end="translate-y-full"
        class="absolute bottom-0 left-0 right-0 bg-white rounded-t-3xl shadow-2xl flex flex-col"
        style="height: 92vh; height: 92dvh;"
    >
        <!-- Drag Handle -->
        <div class="flex justify-center pt-3 pb-1 flex-shrink-0">
            <div class="w-10 h-1.5 rounded-md bg-gray-200"></div>
        </div>

        <!-- Header -->
        <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100 flex-shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl flex items-center justify-center shadow-sm"
                    :class="viewMode ? 'bg-gradient-to-br from-teal-400 to-cyan-500' : (editMode ? 'bg-gradient-to-br from-amber-400 to-orange-500' : 'bg-gradient-to-br from-brand-light to-brand-dark')">
                    <i class="text-white text-sm" :class="viewMode ? 'fa-solid fa-eye' : (editMode ? 'fa-solid fa-pen' : 'fa-solid fa-user-plus')"></i>
                </div>
                <div>
                    <h3 class="text-[15px] font-bold text-gray-800" x-text="viewMode ? 'View Card Details' : (editMode ? 'Edit Student' : 'Add New Card')"></h3>
                    <p class="text-[11px] text-gray-400" x-text="viewMode ? 'Read-only details from selected card' : (editMode ? 'Update student details below' : 'Fill in the student details below')"></p>
                </div>
            </div>
            <button @click="closeAddForm()" class="w-9 h-9 rounded-xl bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-gray-200 active:scale-95 transition-all">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Form Body (scrollable  -  submit is INSIDE so keyboard can't cover it) -->
        <div class="flex-1 overflow-y-auto px-4 py-4 space-y-4">

            <!-- Photo Section -->
            <div class="rounded-2xl p-4 border border-slate-200 bg-gradient-to-br from-slate-50 to-white flex flex-col gap-3">
                <div class="flex items-center justify-between gap-2">
                    <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Card Photos</p>
                    <p class="text-[9px] font-semibold px-2 py-1 rounded-md border bg-sky-50 text-sky-700 border-sky-200" x-show="activeImageField" x-text="'Selected: ' + _fieldLabel(activeImageField)"></p>
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <template x-for="fieldName in imageFormFields" :key="'img-slot-' + fieldName">
                        <div class="flex flex-col gap-1.5">
                            <p class="h-4 text-[9px] font-semibold text-slate-600 truncate flex items-center" :title="_fieldLabel(fieldName)" x-text="_fieldLabel(fieldName)"></p>
                            <div class="relative h-28 w-full rounded-xl border-2 flex flex-col items-center justify-center cursor-pointer transition-all group overflow-hidden shadow-sm"
                                 :class="_imagePreview(fieldName) ? 'border-emerald-300 bg-slate-900' : 'border-dashed border-slate-300 bg-slate-100'"
                                 @click="if(!viewMode) startImageSelection(fieldName)">
                                <template x-if="_imagePreview(fieldName)">
                                    <img
                                        :src="_imagePreview(fieldName)"
                                        class="absolute inset-0 w-full h-full object-contain bg-slate-900 rounded-xl"
                                        @error="if (imageFormState && imageFormState[fieldName]) { imageFormState[fieldName].preview = null; imageFormState[fieldName].has_path = true; imageFormState[fieldName].existing = null; }"
                                    >
                                </template>
                                <template x-if="!_imagePreview(fieldName)">
                                    <div class="flex flex-col items-center gap-1.5 text-center px-1.5">
                                        <div class="w-10 h-10 rounded-xl bg-white border border-slate-200 flex items-center justify-center">
                                            <i class="text-sm transition"
                                               :class="_imageHasPath(fieldName) ? 'fa-solid fa-image text-amber-400' : 'fa-solid fa-camera text-slate-400 group-hover:text-brand-light'"></i>
                                        </div>
                                        <span class="text-[8px] text-slate-500 font-semibold" x-text="_imageHasPath(fieldName) ? 'Image path found' : 'Tap to add'"></span>
                                    </div>
                                </template>
                                <template x-if="!viewMode && _imagePreview(fieldName)">
                                    <div class="absolute bottom-1 right-1 w-6 h-6 rounded-lg bg-slate-900/85 text-white flex items-center justify-center text-[10px] shadow">
                                        <i class="fa-solid fa-camera"></i>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>

                <p class="text-[10px] text-slate-500 text-center" x-text="viewMode ? 'Photo previews' : 'Tap any image slot to upload or replace with a clear image'" ></p>
            </div>

            <!-- Image Picker -->
            <div x-show="showImagePicker && !viewMode" x-transition class="bg-slate-50 rounded-2xl p-3 border border-slate-200">
                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-0.5">Choose Photo Source</p>
                <p class="text-[10px] text-slate-500 mb-2.5" x-show="activeImageField" x-text="'For ' + _fieldLabel(activeImageField)"></p>
                <div class="grid grid-cols-2 gap-2">
                    <button @click="takePhoto()" class="flex flex-col items-center gap-1.5 py-3.5 px-2 bg-white rounded-xl border border-sky-200 shadow-sm active:scale-95 transition-all">
                        <div class="w-11 h-11 rounded-xl bg-blue-50 flex items-center justify-center"><i class="fa-solid fa-camera text-blue-500 text-lg"></i></div>
                        <span class="text-[10px] font-bold text-gray-600">Camera</span>
                    </button>
                    <button @click="pickFromGallery()" class="flex flex-col items-center gap-1.5 py-3.5 px-2 bg-white rounded-xl border border-violet-200 shadow-sm active:scale-95 transition-all">
                        <div class="w-11 h-11 rounded-xl bg-purple-50 flex items-center justify-center"><i class="fa-solid fa-images text-purple-500 text-lg"></i></div>
                        <span class="text-[10px] font-bold text-gray-600">Gallery</span>
                    </button>
                </div>
            </div>

            <input type="file" x-ref="cameraInput" accept="image/*" capture="environment" class="hidden" @change="handleImageSelected($event)">
            <input type="file" x-ref="galleryInput" accept="image/*" class="hidden" @change="handleImageSelected($event)">

            <!-- Dynamic Form Fields -->
            <div class="flex items-center gap-2 pt-1">
                <div class="w-5 h-5 rounded-lg bg-indigo-100 flex items-center justify-center flex-shrink-0">
                    <i class="fa-solid fa-table-list text-indigo-500 text-[8px]"></i>
                </div>
                <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Card Fields</span>
                <div class="flex-1 h-px bg-gray-100"></div>
            </div>

            <template x-if="!dynamicFormFields.length">
                <div class="rounded-2xl border border-amber-100 bg-amber-50/80 px-3 py-2.5 text-[11px] font-semibold text-amber-700">
                    No editable fields found for this table.
                </div>
            </template>

            <template x-for="field in dynamicFormFields" :key="field.name">
                <div class="space-y-1.5">
                    <label class="text-[11px] font-semibold text-gray-500 flex items-center gap-1">
                        <span x-text="_fieldLabel(field.name)"></span>
                        <span class="text-red-400" x-show="field.mandatory">*</span>
                    </label>

                    <template x-if="_fieldInputType(field) === 'textarea'">
                        <textarea x-model="form.dynamicValues[field.name]" rows="2"
                            :readonly="viewMode"
                            :placeholder="'Enter ' + _fieldLabel(field.name)"
                            class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 placeholder:text-gray-400 focus:outline-none focus:border-brand-light focus:ring-2 focus:ring-brand-light/20 transition resize-none"></textarea>
                    </template>

                    <template x-if="_fieldInputType(field) === 'select' && _fieldOptions(field).length">
                        <select x-model="form.dynamicValues[field.name]"
                            :disabled="viewMode"
                            class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 focus:outline-none focus:border-brand-light focus:ring-2 focus:ring-brand-light/20 transition appearance-none">
                            <option value="">Select</option>
                            <template x-for="opt in _fieldOptions(field)" :key="field.name + '-opt-' + opt">
                                <option :value="opt" x-text="opt"></option>
                            </template>
                        </select>
                    </template>

                    <template x-if="_fieldInputType(field) !== 'textarea' && !(_fieldInputType(field) === 'select' && _fieldOptions(field).length)">
                        <input :type="_fieldInputType(field) === 'date' ? 'date' : (_fieldInputType(field) === 'number' ? 'number' : 'text')"
                            x-model="form.dynamicValues[field.name]"
                            :list="_isClassField(field) ? 'class-options' : (_isSectionField(field) ? 'section-options' : '')"
                            :readonly="viewMode"
                            :placeholder="'Enter ' + _fieldLabel(field.name)"
                            class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-700 placeholder:text-gray-400 focus:outline-none focus:border-brand-light focus:ring-2 focus:ring-brand-light/20 transition">
                    </template>
                </div>
            </template>

            <datalist id="class-options">
                {% for cls in classes %}<option value="{{ cls }}">{% endfor %}
            </datalist>
            <datalist id="section-options">
                {% for sec in sections %}<option value="{{ sec }}">{% endfor %}
            </datalist>

            <!-- Submit Buttons -->
            <div class="sticky bottom-0 z-20 flex gap-3 pt-3 pb-[calc(env(safe-area-inset-bottom,0px)+12px)] bg-white/95 backdrop-blur-sm border-t border-gray-100" x-show="!viewMode">
                <button @click="closeAddForm()"
                    class="flex-1 py-3.5 text-[13px] font-semibold text-gray-500 bg-gray-100 border border-gray-150 rounded-2xl hover:bg-gray-200 active:scale-[0.98] transition-all">
                    Cancel
                </button>
                <button @click="submitAddForm()"
                    class="flex-[2] py-3.5 text-[13px] font-bold text-white rounded-2xl shadow-lg hover:shadow-xl active:scale-[0.98] transition-all flex items-center justify-center gap-2"
                    :class="editMode ? 'bg-gradient-to-r from-amber-400 to-orange-500' : 'bg-gradient-to-r from-brand-light to-brand-dark'">
                    <i class="text-[11px]" :class="editMode ? 'fa-solid fa-pen' : 'fa-solid fa-user-plus'"></i>
                    <span x-text="editMode ? 'Update Student' : 'Add Student'"></span>
                </button>
            </div>

            <div class="sticky bottom-0 z-20 flex gap-3 pt-3 pb-[calc(env(safe-area-inset-bottom,0px)+12px)] bg-white/95 backdrop-blur-sm border-t border-gray-100" x-show="viewMode">
                <button @click="closeAddForm()"
                    class="w-full py-3.5 text-[13px] font-semibold text-white rounded-2xl bg-gradient-to-r from-brand-light to-brand-dark shadow-lg active:scale-[0.98] transition-all">
                    Close
                </button>
            </div>

        </div>
    </div>
</div>
