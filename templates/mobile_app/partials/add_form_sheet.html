<!-- Add/Edit Form Bottom Sheet -->
<div
    x-show="showAddForm"
    class="fixed inset-0 z-[70]"
    x-cloak
>
    <!-- Backdrop -->
    <div
        x-show="showAddForm"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        class="absolute inset-0 bg-black/50 backdrop-blur-sm"
        @click="closeAddForm()"
    ></div>

    <!-- Sheet -->
    <div
        x-show="showAddForm"
        x-transition:enter="transition ease-out duration-400"
        x-transition:enter-start="translate-y-full"
        x-transition:enter-end="translate-y-0"
        x-transition:leave="transition ease-in duration-300"
        x-transition:leave-start="translate-y-0"
        x-transition:leave-end="translate-y-full"
        class="absolute bottom-0 left-0 right-0 bg-white rounded-t-lg shadow-2xl flex flex-col"
        style="height: 90vh; height: 90dvh;"
    >
        <!-- Drag Handle -->
        <div class="flex justify-center pt-2 pb-1 flex-shrink-0">
            <div class="w-10 h-1 rounded-full bg-gray-300"></div>
        </div>

        <!-- Header -->
        <div class="flex items-center justify-between px-4 py-2 border-b border-gray-100 flex-shrink-0">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center"
                    :class="editMode ? 'bg-amber-500' : 'bg-gradient-to-br from-brand-light to-brand-dark'">
                    <i class="text-white text-xs" :class="editMode ? 'fa-solid fa-pen' : 'fa-solid fa-plus'"></i>
                </div>
                <div>
                    <h3 class="text-sm font-bold text-gray-800" x-text="editMode ? 'Edit Student' : 'Add New Card'"></h3>
                    <p class="text-[10px] text-gray-400" x-text="editMode ? 'Update student details' : 'Fill in student details'"></p>
                </div>
            </div>
            <button @click="closeAddForm()" class="w-8 h-8 rounded-lg bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-gray-200 active:scale-95 transition-all">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
        </div>

        <!-- Form Body (scrollable — submit is INSIDE so keyboard can't cover it) -->
        <div class="flex-1 overflow-y-auto px-4 py-3 space-y-4">

            <!-- Photo Section -->
            <div class="flex flex-col items-center gap-2">
                <div class="relative w-24 h-32 rounded-md border-2 border-dashed border-gray-300 flex flex-col items-center justify-center cursor-pointer hover:border-brand-light hover:bg-brand-light/5 transition-all group overflow-hidden"
                     @click="openImagePicker()">
                    <template x-if="form.photoPreview">
                        <img :src="form.photoPreview" class="absolute inset-0 w-full h-full object-cover rounded-md">
                    </template>
                    <template x-if="!form.photoPreview">
                        <div class="flex flex-col items-center gap-1">
                            <i class="fa-solid fa-camera text-lg text-gray-400 group-hover:text-brand-light transition"></i>
                            <span class="text-[9px] text-gray-400 font-medium">Add Photo</span>
                        </div>
                    </template>
                    <template x-if="form.photoPreview">
                        <div class="absolute bottom-1 right-1 w-6 h-6 rounded-full bg-brand-light text-white flex items-center justify-center text-[10px] shadow">
                            <i class="fa-solid fa-camera"></i>
                        </div>
                    </template>
                </div>
                <!-- Re-crop button (visible when photo is set) -->
                <button x-show="form.photoPreview" @click="cropSourceUrl = form.photoPreview; cropSourceFile = null; showCropModal = true; $nextTick(() => initCropper())"
                        class="flex items-center gap-1.5 px-3 py-1.5 text-[10px] font-semibold text-brand-light bg-brand-light/10 border border-brand-light/20 rounded-lg hover:bg-brand-light/20 active:scale-95 transition-all">
                    <i class="fa-solid fa-crop-simple"></i>
                    Crop / Adjust
                </button>
                <p class="text-[10px] text-gray-400">Tap photo to change · Crop to adjust</p>
            </div>

            <!-- Image Picker -->
            <div x-show="showImagePicker" x-transition class="bg-gray-50 rounded-md p-3 border border-gray-100">
                <p class="text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-2">Choose Photo Source</p>
                <div class="grid grid-cols-2 gap-2">
                    <button @click="takePhoto()" class="flex flex-col items-center gap-1.5 py-3 px-2 bg-white rounded-lg border border-gray-200 hover:border-brand-light hover:bg-brand-light/5 active:scale-95 transition-all">
                        <div class="w-10 h-10 rounded-md bg-blue-50 flex items-center justify-center"><i class="fa-solid fa-camera text-blue-500"></i></div>
                        <span class="text-[10px] font-semibold text-gray-600">Camera</span>
                    </button>
                    <button @click="pickFromGallery()" class="flex flex-col items-center gap-1.5 py-3 px-2 bg-white rounded-lg border border-gray-200 hover:border-brand-light hover:bg-brand-light/5 active:scale-95 transition-all">
                        <div class="w-10 h-10 rounded-md bg-purple-50 flex items-center justify-center"><i class="fa-solid fa-images text-purple-500"></i></div>
                        <span class="text-[10px] font-semibold text-gray-600">Gallery</span>
                    </button>
                </div>
            </div>

            <input type="file" x-ref="cameraInput" accept="image/*" capture="environment" class="hidden" @change="handleImageSelected($event)">
            <input type="file" x-ref="galleryInput" accept="image/*" class="hidden" @change="handleImageSelected($event)">

            <!-- Name -->
            <div class="space-y-1">
                <label class="text-[11px] font-semibold text-gray-600 uppercase tracking-wide">Full Name <span class="text-red-400">*</span></label>
                <input type="text" x-model="form.name" placeholder="Enter student name"
                    class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-700 placeholder:text-gray-400 focus:outline-none focus:border-brand-light focus:ring-2 focus:ring-brand-light/20 transition">
            </div>

            <!-- Father's Name -->
            <div class="space-y-1">
                <label class="text-[11px] font-semibold text-gray-600 uppercase tracking-wide">Father's Name <span class="text-red-400">*</span></label>
                <input type="text" x-model="form.fatherName" placeholder="Enter father's name"
                    class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-700 placeholder:text-gray-400 focus:outline-none focus:border-brand-light focus:ring-2 focus:ring-brand-light/20 transition">
            </div>

            <!-- Mother's Name -->
            <div class="space-y-1">
                <label class="text-[11px] font-semibold text-gray-600 uppercase tracking-wide">Mother's Name</label>
                <input type="text" x-model="form.motherName" placeholder="Enter mother's name"
                    class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-700 placeholder:text-gray-400 focus:outline-none focus:border-brand-light focus:ring-2 focus:ring-brand-light/20 transition">
            </div>

            <!-- Roll No & DOB -->
            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="text-[11px] font-semibold text-gray-600 uppercase tracking-wide">Roll No <span class="text-red-400">*</span></label>
                    <input type="text" x-model="form.rollNo" placeholder="e.g. R2345"
                        class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-700 placeholder:text-gray-400 focus:outline-none focus:border-brand-light focus:ring-2 focus:ring-brand-light/20 transition">
                </div>
                <div class="space-y-1">
                    <label class="text-[11px] font-semibold text-gray-600 uppercase tracking-wide">Date of Birth <span class="text-red-400">*</span></label>
                    <input type="date" x-model="form.dob"
                        class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-700 focus:outline-none focus:border-brand-light focus:ring-2 focus:ring-brand-light/20 transition">
                </div>
            </div>

            <!-- Class & Section -->
            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="text-[11px] font-semibold text-gray-600 uppercase tracking-wide">Class <span class="text-red-400">*</span></label>
                    <input type="text" x-model="form.className" list="class-options" placeholder="e.g. 5A"
                        class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-700 placeholder:text-gray-400 focus:outline-none focus:border-brand-light focus:ring-2 focus:ring-brand-light/20 transition">
                    <datalist id="class-options">
                        {% for cls in classes %}<option value="{{ cls }}">{% endfor %}
                    </datalist>
                </div>
                <div class="space-y-1">
                    <label class="text-[11px] font-semibold text-gray-600 uppercase tracking-wide">Section <span class="text-red-400">*</span></label>
                    <input type="text" x-model="form.section" list="section-options" placeholder="e.g. A"
                        class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-700 placeholder:text-gray-400 focus:outline-none focus:border-brand-light focus:ring-2 focus:ring-brand-light/20 transition">
                    <datalist id="section-options">
                        {% for sec in sections %}<option value="{{ sec }}">{% endfor %}
                    </datalist>
                </div>
            </div>

            <!-- Phone -->
            <div class="space-y-1">
                <label class="text-[11px] font-semibold text-gray-600 uppercase tracking-wide">Phone Number</label>
                <input type="tel" x-model="form.phone" placeholder="e.g. 9876543210"
                    class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-700 placeholder:text-gray-400 focus:outline-none focus:border-brand-light focus:ring-2 focus:ring-brand-light/20 transition">
            </div>

            <!-- Address -->
            <div class="space-y-1">
                <label class="text-[11px] font-semibold text-gray-600 uppercase tracking-wide">Address</label>
                <textarea x-model="form.address" rows="2" placeholder="Enter full address"
                    class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-700 placeholder:text-gray-400 focus:outline-none focus:border-brand-light focus:ring-2 focus:ring-brand-light/20 transition resize-none"></textarea>
            </div>

            <!-- Blood Group & Aadhar -->
            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="text-[11px] font-semibold text-gray-600 uppercase tracking-wide">Blood Group</label>
                    <select x-model="form.bloodGroup"
                        class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-700 focus:outline-none focus:border-brand-light focus:ring-2 focus:ring-brand-light/20 transition appearance-none">
                        <option value="">Select</option>
                        <option value="A+">A+</option><option value="A-">A-</option>
                        <option value="B+">B+</option><option value="B-">B-</option>
                        <option value="O+">O+</option><option value="O-">O-</option>
                        <option value="AB+">AB+</option><option value="AB-">AB-</option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="text-[11px] font-semibold text-gray-600 uppercase tracking-wide">Aadhar No</label>
                    <input type="text" x-model="form.aadhar" placeholder="xxxx-xxxx-xxxx" maxlength="14"
                        class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-700 placeholder:text-gray-400 focus:outline-none focus:border-brand-light focus:ring-2 focus:ring-brand-light/20 transition">
                </div>
            </div>

            <!-- Submit Buttons (INSIDE scroll so keyboard can never hide them) -->
            <div class="flex gap-2 pt-3 pb-8">
                <button @click="closeAddForm()"
                    class="flex-1 py-3 text-xs font-semibold text-gray-600 bg-gray-100 border border-gray-200 rounded-lg hover:bg-gray-200 active:scale-[0.98] transition-all">
                    Cancel
                </button>
                <button @click="submitAddForm()"
                    class="flex-[2] py-3 text-xs font-semibold text-white rounded-lg shadow-md hover:shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-1.5"
                    :class="editMode ? 'bg-amber-500 hover:bg-amber-600' : 'bg-gradient-to-r from-brand-light to-brand-dark'">
                    <i class="text-[10px]" :class="editMode ? 'fa-solid fa-pen' : 'fa-solid fa-plus'"></i>
                    <span x-text="editMode ? 'Update Student' : 'Add Student'"></span>
                </button>
            </div>

        </div>
    </div>
</div>

<!-- Image Crop Modal (z-[80] — above add form) -->
<div x-show="showCropModal" x-cloak class="fixed inset-0 z-[80] flex flex-col bg-black">
    <!-- Header -->
    <div class="flex items-center justify-between px-4 py-3 bg-black/80 flex-shrink-0">
        <div>
            <h3 class="text-white font-bold text-sm">Crop Photo</h3>
            <p class="text-white/50 text-[10px]">Drag to adjust · Pinch to zoom</p>
        </div>
        <button @click="closeCropModal()" class="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center text-white">
            <i class="fa-solid fa-xmark text-sm"></i>
        </button>
    </div>

    <!-- Crop area -->
    <div class="flex-1 overflow-hidden relative">
        <img id="crop-img-target"
             :src="cropSourceUrl"
             style="max-width: 100%; display: block;">
    </div>

    <!-- Footer buttons -->
    <div class="flex gap-3 px-4 py-4 bg-black/80 flex-shrink-0">
        <button @click="skipCrop()"
                class="flex-1 py-3 text-xs font-semibold text-white bg-white/15 rounded-md border border-white/20 active:scale-[0.98] transition-all">
            <i class="fa-solid fa-forward mr-1.5"></i>Skip Crop
        </button>
        <button @click="cropAndUse()"
                class="flex-[2] py-3 text-xs font-bold text-white bg-gradient-to-r from-brand-light to-brand-dark rounded-md shadow-lg active:scale-[0.98] transition-all">
            <i class="fa-solid fa-crop-simple mr-1.5"></i>Crop &amp; Use
        </button>
    </div>
</div>
