<!-- Top Navigation Bar Partial -->
<div class="sticky top-0 z-50 bg-white/95 backdrop-blur-md shadow-sm">
    <div class="flex items-center justify-between px-4 py-3">
        <!-- Left: Profile & Name -->
        <a href="{% url 'mobile_app:profile' %}" class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-br from-brand-light to-brand-dark flex items-center justify-center text-white font-bold text-sm shadow-md">
                {{ user_name|default:"AU"|truncatechars:2|upper }}
            </div>
            <div>
                <p class="text-xs text-gray-400 leading-none">Welcome back</p>
                <p class="text-sm font-semibold text-gray-800">{{ user_name|default:"Admin User" }}</p>
            </div>
        </a>
        <!-- Right: Notification Bell -->
        <a href="{% url 'mobile_app:notifications' %}" class="relative p-2" x-data="{ hasNew: {{ has_new_activity|yesno:'true,false' }} }">
            <i class="fa-solid fa-bell text-xl text-gray-600"></i>
            <span x-show="hasNew" class="absolute top-1 right-1 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-white"></span>
        </a>
    </div>
</div>
