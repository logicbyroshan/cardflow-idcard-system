<!-- Top Navigation Bar Partial -->
<div class="pwa-topbar pwa-page-topbar sticky top-0 z-50 bg-white shadow-[0_1px_8px_rgba(0,0,0,0.08)]">
    <div class="pwa-topbar-inner flex items-center justify-between px-4">

        <!-- -- LEFT: Profile avatar icon only (opens left profile drawer) -- -->
        <button type="button"
                @click="$dispatch('open-profile-drawer')"
            class="w-11 h-11 rounded-2xl bg-white flex items-center justify-center text-gray-700 shadow-sm active:scale-95 transition-transform flex-shrink-0 select-none border border-gray-200 overflow-hidden">
            {% if current_client_logo_url and is_client or current_client_logo_url and is_client_staff %}
                <img src="{{ current_client_logo_url }}" alt="{{ current_client.name|default:'Client Logo' }}" class="w-full h-full object-contain bg-white">
            {% elif is_super_admin %}
                <i class="fa-solid fa-crown text-[15px]"></i>
            {% elif is_admin_staff %}
                <i class="fa-solid fa-user text-[15px]"></i>
            {% elif is_client %}
                <i class="fa-solid fa-building text-[15px]"></i>
            {% else %}
                <i class="fa-solid fa-user text-[15px]"></i>
            {% endif %}
        </button>

        <!-- -- CENTER: App title (subtle) -- -->
        <p class="text-[13px] font-bold text-gray-700 tracking-tight select-none">Adarsh ID Cards</p>

        <!-- -- RIGHT: Notification bell + Hamburger -- -->
        <div class="flex items-center gap-1">
            <!-- Notification bell with count -->
            <button type="button"
                    @click="$dispatch('open-notification-drawer')"
                    class="relative w-11 h-11 flex items-center justify-center rounded-xl bg-gray-50 text-gray-500 active:bg-gray-100 transition-colors">
                <i class="fa-solid fa-bell text-[16px]"></i>
                {% if notification_count and notification_count > 0 %}
                <span class="absolute top-1 right-1 min-w-[17px] h-[17px] bg-red-500 rounded-full border-2 border-white flex items-center justify-center pointer-events-none">
                    <span class="text-white text-[9px] font-bold leading-none px-0.5">{{ notification_count|default:0 }}</span>
                </span>
                {% endif %}
            </button>
            <!-- Hamburger  -  opens the right side drawer -->
            <button type="button"
                    @click="$dispatch('open-hamburger')"
                    class="w-11 h-11 flex flex-col items-center justify-center gap-[5px] rounded-xl bg-gray-50 text-gray-600 active:bg-gray-100 transition-colors">
                <span class="block w-[18px] h-[2px] bg-current rounded-full"></span>
                <span class="block w-[14px] h-[2px] bg-current rounded-full self-start ml-[2px]"></span>
                <span class="block w-[18px] h-[2px] bg-current rounded-full"></span>
            </button>
        </div>

    </div>
</div>
