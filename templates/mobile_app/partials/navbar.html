<!-- Top Navigation Bar Partial -->
<div class="pwa-topbar sticky top-0 z-50 bg-white shadow-[0_1px_8px_rgba(0,0,0,0.08)]">
    <div class="flex items-center justify-between px-4" style="height:56px;">

        <!-- ── LEFT: Avatar + Name ── -->
        <a href="{% url 'mobile_app:profile' %}" class="flex items-center gap-2.5 min-w-0">
            <!-- Square avatar with rounded corners (NOT a circle) -->
            <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-[#667eea] to-[#764ba2] flex items-center justify-center text-white font-bold text-sm shadow flex-shrink-0 select-none" style="letter-spacing:0.02em;">
                {{ user_name|default:"AU"|truncatechars:2|upper }}
            </div>
            <div class="min-w-0">
                <p class="text-[10px] text-gray-400 leading-none mb-0.5">Welcome back</p>
                <p class="text-[13px] font-semibold text-gray-800 leading-tight truncate max-w-[130px]">{{ user_name|default:"Admin User" }}</p>
            </div>
        </a>

        <!-- ── RIGHT: Notification + Hamburger ── -->
        <div class="flex items-center gap-1">
            <!-- Notification bell -->
            <a href="{% url 'mobile_app:notifications' %}"
               class="relative w-9 h-9 flex items-center justify-center rounded-lg text-gray-500 active:bg-gray-100 transition-colors"
               x-data="{ hasNew: {{ has_new_activity|yesno:'true,false'|default:'false' }} }">
                <i class="fa-solid fa-bell text-[18px]"></i>
                <span x-show="hasNew"
                      class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full border-2 border-white pointer-events-none">
                </span>
            </a>
            <!-- Hamburger — opens the side drawer -->
            <button type="button"
                    @click="$dispatch('open-hamburger')"
                    class="w-9 h-9 flex flex-col items-center justify-center gap-[5px] rounded-lg text-gray-600 active:bg-gray-100 transition-colors">
                <span class="block w-[18px] h-[2px] bg-current rounded-full"></span>
                <span class="block w-[14px] h-[2px] bg-current rounded-full self-start ml-[2px]"></span>
                <span class="block w-[18px] h-[2px] bg-current rounded-full"></span>
            </button>
        </div>

    </div>
</div>
