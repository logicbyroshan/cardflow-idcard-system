{% load static %}
<header class="topbar">
  <div class="nav-left">
    <button class="sidebar-toggle" id="sidebarToggle" @click="toggleSidebar()" aria-label="Toggle sidebar">
      <i class="fa-solid fa-bars" :class="sidebarOpen ? 'fa-xmark' : 'fa-bars'"></i>
    </button>
    <div class="breadcrumb">
      {% if is_super_admin %}
      <a href="{% url 'dashboard' %}" class="breadcrumb-item"><i class="fa-solid fa-house"></i> Home</a>
      {% elif is_admin_staff %}
      <a href="{% url 'admin_staff_dashboard' %}" class="breadcrumb-item"><i class="fa-solid fa-house"></i> Home</a>
      {% endif %}
      <i class="fa-solid fa-chevron-right breadcrumb-sep"></i>
      <a href="{% url 'active_clients' %}" class="breadcrumb-item">Active Clients</a>
      <i class="fa-solid fa-chevron-right breadcrumb-sep"></i>
      <span class="breadcrumb-item">{{ client.name }}</span>
      <i class="fa-solid fa-chevron-right breadcrumb-sep"></i>
      <span class="breadcrumb-item active">{{ table.name }}</span>
    </div>
  </div>
  <div class="nav-right cp-topbar-bell-wrap">
    {% include 'partials/notification-bell.html' %}
  </div>
  <div class="nav-right">
    <div class="action-tabs">
      <a href="{% url 'cardprint:print_cards' table.id %}?step=generate_list" class="action-tab print-generate-tab {% if current_step == 'generate_list' %}active{% endif %}">
        <span class="tab-label">Generate List</span>
        <span class="tab-count">{{ step_counts.generate_list }}</span>
      </a>
      <a href="{% url 'cardprint:print_cards' table.id %}?step=finalized" class="action-tab print-finalized-tab {% if current_step == 'finalized' %}active{% endif %}">
        <span class="tab-label">Finalized</span>
        <span class="tab-count">{{ step_counts.finalized }}</span>
      </a>
    </div>
  </div>
</header>
