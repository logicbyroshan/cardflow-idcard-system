<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ status_code }} {{ title }}</title>
    <style>
        :root {
            --bg-a: #f5f7ff;
            --bg-b: #eef8ff;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #475569;
            --border: #dbe4ff;
            --primary: #0f766e;
            --primary-hover: #115e59;
            --ghost: #ffffff;
            --ghost-border: #cbd5e1;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(circle at 10% 10%, #dbeafe 0, transparent 35%),
                radial-gradient(circle at 90% 80%, #d1fae5 0, transparent 35%),
                linear-gradient(135deg, var(--bg-a), var(--bg-b));
            color: var(--text);
            font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        }

        .error-card {
            width: 100%;
            max-width: 680px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.1);
        }

        .code {
            display: inline-block;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: var(--primary);
            background: #ecfeff;
            border: 1px solid #99f6e4;
            border-radius: 999px;
            padding: 6px 12px;
            text-transform: uppercase;
        }

        h1 {
            margin: 14px 0 10px;
            font-size: clamp(28px, 4vw, 36px);
            line-height: 1.2;
        }

        p {
            margin: 0;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.6;
        }

        .actions {
            margin-top: 22px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            text-decoration: none;
            border-radius: 10px;
            padding: 10px 16px;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid transparent;
        }

        .btn-primary {
            color: #fff;
            background: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            color: var(--text);
            background: var(--ghost);
            border-color: var(--ghost-border);
        }

        .btn-secondary:hover {
            background: #f8fafc;
        }

        .help-note {
            margin-top: 18px;
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <main class="error-card">
        <span class="code">Error {{ status_code }}</span>
        <h1>{{ heading }}</h1>
        <p>{{ message }}</p>

        <div class="actions">
            <a class="btn btn-primary" href="{{ home_url }}">Go to Home</a>
            <a class="btn btn-secondary" href="javascript:history.back()">Go Back</a>
        </div>

        <p class="help-note">If the issue continues, please contact your administrator.</p>
    </main>
</body>
</html>
