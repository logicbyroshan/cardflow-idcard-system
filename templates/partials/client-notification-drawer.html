<div class="drawer-overlay client-notification-overlay" id="clientNotificationDrawerOverlay" aria-hidden="true"></div>

<aside
  class="side-drawer client-notification-drawer"
  id="clientNotificationDrawer"
  aria-hidden="true"
  data-notifications-api="{% url 'api_notifications_list' %}"
  data-mark-all-read-api="{% url 'api_notifications_mark_all_read' %}">
  <div class="drawer-header client-notification-drawer-header">
    <h3>
      <i class="fa-solid fa-bell" aria-hidden="true"></i>
      <span>Notifications</span>
      <span class="client-message-header-pill" id="clientNotificationUnreadPill">0 unread</span>
    </h3>
    <button type="button" class="drawer-close" id="clientNotificationDrawerClose" aria-label="Close notifications">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <div class="drawer-body client-notification-drawer-body" id="clientNotificationDrawerBody">
    <div class="client-message-thread" id="clientNotificationThread">
      <div class="client-message-thread-state">Loading notifications...</div>
    </div>
  </div>

  <div class="drawer-footer client-message-drawer-footer">
    <button type="button" class="btn btn-sm btn-neutral" id="clientNotificationMarkAllReadBtn">
      <i class="fa-solid fa-check-double"></i>
      Mark all read
    </button>
    <a href="{% url 'notifications_page' %}" class="btn btn-sm btn-neutral">
      <i class="fa-solid fa-up-right-from-square"></i>
      Full page
    </a>
  </div>
</aside>
