<!-- === LOG HISTORY TAB === -->
<div class="panel-tab-content panel-tab-full-height" id="tab-log-history">

  <!-- Header bar -->
  <div class="notif-actions-bar">
    <div class="notif-actions-left">
      <div class="notif-search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="logSearch" placeholder="Search logs..." oninput="debounceLogSearch()">
      </div>
      <select id="logUserTypeFilter" class="form-select-sm" onchange="loadLogs()">
        <option value="">All User Types</option>
        <option value="super_admin">Super Admin</option>
        <option value="admin_staff">Admin Staff</option>
        <option value="client">Client</option>
        <option value="client_staff">Client Staff</option>
      </select>
    </div>
    <div class="notif-actions-right">
      <span class="text-xs text-gray-400" id="logCountLabel"> - </span>
    </div>
  </div>

  <!-- Logs Table -->
  <div class="notif-table-wrap">
    <table class="notif-table">
      <thead>
        <tr>
          <th scope="col" style="width:5%">#</th>
          <th scope="col" style="width:14%">User</th>
          <th scope="col" style="width:12%">Action</th>
          <th scope="col" style="width:35%">Description</th>
          <th scope="col" style="width:12%">Target</th>
          <th scope="col" style="width:10%">IP Address</th>
          <th scope="col" style="width:12%">Time</th>
        </tr>
      </thead>
      <tbody id="logTableBody">
        <tr class="notif-table-empty">
          <td colspan="7">
            <div class="empty-state">
              <i class="fa-solid fa-clock-rotate-left"></i>
              <p>No logs found</p>
              <span>Activity logs will appear here</span>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
