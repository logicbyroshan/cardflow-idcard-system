<!-- === MONITORING TAB === -->
<div class="panel-tab-content" id="tab-monitoring">

  <!-- Header bar -->
  <div class="notif-actions-bar">
    <div class="notif-actions-left">
      <span class="panel-title">
        <i class="fa-solid fa-chart-line"></i>
        Background Task Monitor
      </span>
    </div>
    <div class="notif-actions-right">
      <span id="monitoringLastUpdated" class="text-xs text-gray-400 mr-2.5">—</span>
      <button class="btn btn-sm btn-outline-primary" onclick="loadMonitoring()" id="monitoringRefreshBtn">
        <i class="fa-solid fa-arrows-rotate"></i> Refresh
      </button>
    </div>
  </div>

  <!-- Stats cards -->
  <div class="system-grid mb-4" id="monitoringStats">
    <div class="system-card">
      <div class="system-card-header"><i class="fa-solid fa-spinner"></i> Active Tasks</div>
      <div class="system-card-body">
        <span id="statActiveTasks" class="monitor-stat-value monitor-stat-active">—</span>
      </div>
    </div>
    <div class="system-card">
      <div class="system-card-header"><i class="fa-solid fa-clock"></i> Pending</div>
      <div class="system-card-body">
        <span id="statPendingTasks" class="monitor-stat-value monitor-stat-pending">—</span>
      </div>
    </div>
    <div class="system-card">
      <div class="system-card-header"><i class="fa-solid fa-circle-check"></i> Completed (24 h)</div>
      <div class="system-card-body">
        <span id="statCompleted24h" class="monitor-stat-value monitor-stat-success">—</span>
      </div>
    </div>
    <div class="system-card">
      <div class="system-card-header"><i class="fa-solid fa-circle-xmark"></i> Failed (24 h)</div>
      <div class="system-card-body">
        <span id="statFailed24h" class="monitor-stat-value monitor-stat-danger">—</span>
      </div>
    </div>
  </div>

  <!-- Active Backup Tasks (shown only when backups are in progress) -->
  <div id="monitoringBackups" style="display:none;margin-bottom:16px;">
    <div class="system-card system-card--accent">
      <div class="system-card-header"><i class="fa-solid fa-database"></i> Active Backup Tasks</div>
      <div class="system-card-body" id="monitoringBackupBody" style="padding:6px 0;"></div>
    </div>
  </div>

  <!-- Recent Background Tasks table -->
  <div class="system-card" style="padding:0;overflow:hidden;">
    <div class="system-card-header">
      <i class="fa-solid fa-list-check"></i> Recent Background Tasks
      <span id="monitoringTaskCount" class="panel-tab-badge ml-1.5">0</span>
    </div>
    <div class="notif-table-wrap max-h-[380px] overflow-y-auto">
      <table class="notif-table">
        <thead>
          <tr>
            <th scope="col" style="width:5%">#</th>
            <th scope="col" style="width:18%">Type</th>
            <th scope="col" style="width:14%">Status</th>
            <th scope="col" style="width:20%">User</th>
            <th scope="col" style="width:12%">Progress</th>
            <th scope="col" style="width:14%">Started</th>
            <th scope="col" style="width:14%">Finished</th>
            <th scope="col" style="width:3%"></th>
          </tr>
        </thead>
        <tbody id="monitoringTasksBody">
          <tr class="notif-table-empty">
            <td colspan="8">
              <div class="empty-state">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p>Loading…</p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
