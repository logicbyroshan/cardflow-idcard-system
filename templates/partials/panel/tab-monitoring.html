<!-- === MONITORING TAB === -->
<div class="panel-tab-content" id="tab-monitoring">

  <!-- Header bar -->
  <div class="notif-actions-bar">
    <div class="notif-actions-left">
      <span class="panel-title" style="font-size:13px;font-weight:600;color:#1e293b;">
        <i class="fa-solid fa-chart-line" style="color:#667eea;margin-right:6px;"></i>
        Background Task Monitor
      </span>
    </div>
    <div class="notif-actions-right">
      <span id="monitoringLastUpdated" class="text-xs text-gray-400" style="margin-right:10px;">—</span>
      <button class="backup-btn-primary" onclick="loadMonitoring()" id="monitoringRefreshBtn" style="padding:5px 12px;font-size:12px;">
        <i class="fa-solid fa-arrows-rotate"></i> Refresh
      </button>
    </div>
  </div>

  <!-- Stats cards -->
  <div class="system-grid" id="monitoringStats" style="margin-bottom:16px;">
    <div class="system-card">
      <div class="system-card-header"><i class="fa-solid fa-spinner"></i> Active Tasks</div>
      <div class="system-card-body" style="display:flex;align-items:center;justify-content:center;padding:16px 0;">
        <span id="statActiveTasks" style="font-size:28px;font-weight:700;color:#667eea;">—</span>
      </div>
    </div>
    <div class="system-card">
      <div class="system-card-header"><i class="fa-solid fa-clock"></i> Pending</div>
      <div class="system-card-body" style="display:flex;align-items:center;justify-content:center;padding:16px 0;">
        <span id="statPendingTasks" style="font-size:28px;font-weight:700;color:#f59e0b;">—</span>
      </div>
    </div>
    <div class="system-card">
      <div class="system-card-header"><i class="fa-solid fa-circle-check"></i> Completed (24 h)</div>
      <div class="system-card-body" style="display:flex;align-items:center;justify-content:center;padding:16px 0;">
        <span id="statCompleted24h" style="font-size:28px;font-weight:700;color:#22c55e;">—</span>
      </div>
    </div>
    <div class="system-card">
      <div class="system-card-header"><i class="fa-solid fa-circle-xmark"></i> Failed (24 h)</div>
      <div class="system-card-body" style="display:flex;align-items:center;justify-content:center;padding:16px 0;">
        <span id="statFailed24h" style="font-size:28px;font-weight:700;color:#ef4444;">—</span>
      </div>
    </div>
  </div>

  <!-- Active Backup Tasks (shown only when backups are in progress) -->
  <div id="monitoringBackups" style="display:none;margin-bottom:16px;">
    <div class="system-card" style="border-left:3px solid #667eea;">
      <div class="system-card-header"><i class="fa-solid fa-database"></i> Active Backup Tasks</div>
      <div class="system-card-body" id="monitoringBackupBody" style="padding:6px 0;"></div>
    </div>
  </div>

  <!-- Recent Background Tasks table -->
  <div class="system-card" style="padding:0;overflow:hidden;">
    <div class="system-card-header" style="border-bottom:1px solid #f1f5f9;padding:10px 14px;">
      <i class="fa-solid fa-list-check"></i> Recent Background Tasks
      <span id="monitoringTaskCount" class="panel-tab-badge" style="margin-left:6px;">0</span>
    </div>
    <div class="notif-table-wrap" style="max-height:380px;overflow-y:auto;">
      <table class="notif-table">
        <thead>
          <tr>
            <th scope="col" style="width:5%">#</th>
            <th scope="col" style="width:18%">Type</th>
            <th scope="col" style="width:14%">Status</th>
            <th scope="col" style="width:20%">User</th>
            <th scope="col" style="width:12%">Progress</th>
            <th scope="col" style="width:14%">Started</th>
            <th scope="col" style="width:14%">Finished</th>
            <th scope="col" style="width:3%"></th>
          </tr>
        </thead>
        <tbody id="monitoringTasksBody">
          <tr class="notif-table-empty">
            <td colspan="8">
              <div class="empty-state">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p>Loading…</p>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
