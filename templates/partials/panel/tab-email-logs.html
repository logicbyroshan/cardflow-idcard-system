<!-- === EMAIL MANAGEMENT TAB === -->
<div class="panel-tab-content" id="tab-email-logs">

  <!-- Actions / Filter bar -->
  <div class="notif-actions-bar">
    <div class="notif-actions-left">
      <select id="emailStatusFilter" class="form-select-sm" onchange="loadEmailLogs()">
        <option value="">All Statuses</option>
        <option value="on_hold">On Hold</option>
        <option value="pending">Pending</option>
        <option value="sent">Sent</option>
        <option value="failed">Failed</option>
      </select>
      <select id="emailTypeFilter" class="form-select-sm" onchange="loadEmailLogs()">
        <option value="">All Types</option>
        <option value="welcome">Welcome / Activation</option>
        <option value="temp_password">Temp Password</option>
        <option value="password_change">Password Change Notice</option>
      </select>
      <button class="btn btn-sm btn-outline-primary" onclick="loadEmailLogs()">
        <i class="fa-solid fa-rotate-right"></i> Refresh
      </button>
    </div>
    <div class="notif-actions-right">
      <span class="email-status-badge on-hold" title="On Hold">
        <i class="fa-solid fa-clock"></i> <span id="emailCountOnHold">0</span>
      </span>
      <span class="email-status-badge pending" title="Pending">
        <i class="fa-solid fa-hourglass-half"></i> <span id="emailCountPending">0</span>
      </span>
      <span class="email-status-badge sent" title="Sent">
        <i class="fa-solid fa-circle-check"></i> <span id="emailCountSent">0</span>
      </span>
      <span class="email-status-badge failed" title="Failed">
        <i class="fa-solid fa-circle-xmark"></i> <span id="emailCountFailed">0</span>
      </span>
    </div>
  </div>

  <!-- Email Logs Table -->
  <div class="notif-table-wrap" style="max-height:calc(100vh - 280px); overflow-y:auto;">
    <table class="notif-table" id="emailLogsTable">
      <thead>
        <tr>
          <th scope="col" style="width:5%">#</th>
          <th scope="col" style="width:19%">Recipient</th>
          <th scope="col" style="width:24%">Email Address</th>
          <th scope="col" style="width:16%">Type</th>
          <th scope="col" style="width:12%">Status</th>
          <th scope="col" style="width:14%">Created</th>
          <th scope="col" style="width:10%">Note</th>
        </tr>
      </thead>
      <tbody id="emailLogsBody">
        <tr class="notif-table-empty">
          <td colspan="7">
            <div class="empty-state">
              <i class="fa-solid fa-envelope"></i>
              <p>No email logs yet</p>
              <span>Logs will appear here after emails are sent</span>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="notif-actions-bar" style="padding-top:10px; padding-bottom:4px; border-top:1px solid #f1f5f9; margin-top:0;">
    <span class="text-xs text-gray-400" id="emailLogCountLabel">—</span>
    <div style="display:flex; gap:6px; align-items:center;">
      <button class="btn btn-sm btn-outline-primary" id="emailPrevBtn" onclick="emailLogPage(-1)" disabled>
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <span id="emailPageLabel" style="font-size:12px; color:#64748b; padding:0 6px;">—</span>
      <button class="btn btn-sm btn-outline-primary" id="emailNextBtn" onclick="emailLogPage(1)" disabled>
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>
  </div>

</div>
