{% load static %}
<!-- === DOWNLOAD TEMPLATES TAB === -->
<div class="panel-tab-content" id="tab-download-templates">

  <!-- Header bar -->
  <div class="notif-actions-bar">
    <div class="notif-actions-left">
      <p class="text-xs text-gray-500">Manage export templates used in PDF & Word downloads</p>
    </div>
    <div class="notif-actions-right">
      <button class="btn btn-md btn-primary" onclick="openCreateTemplateModal()">
        <i class="fa-solid fa-plus"></i> New Template
      </button>
    </div>
  </div>

  <!-- Templates Table -->
  <div class="notif-table-wrap">
    <table class="notif-table">
      <thead>
        <tr>
          <th scope="col" style="width:5%">#</th>
          <th scope="col" style="width:20%">Name</th>
          <th scope="col" style="width:45%">Instructions / Footer Text</th>
          <th scope="col" style="width:10%">Default</th>
          <th scope="col" style="width:10%">Created</th>
          <th scope="col" style="width:10%">Actions</th>
        </tr>
      </thead>
      <tbody id="templateTableBody">
        <tr class="notif-table-empty">
          <td colspan="6">
            <div class="empty-state">
              <i class="fa-solid fa-file-lines"></i>
              <p>No templates yet</p>
              <span>Create your first export template to get started</span>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Create / Edit Template Modal -->
<div class="center-modal-overlay" id="templateModal" onclick="if(event.target===this)closeTemplateModal()">
  <div class="center-modal-card" style="max-width:540px; width:100%; text-align:left;">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
      <h3 id="templateModalTitle" style="font-size:15px; font-weight:700; color:#1e293b; margin:0; display:flex; align-items:center; gap:8px;">
        <i class="fa-solid fa-file-lines" style="color:#667eea;"></i> New Template
      </h3>
      <button onclick="closeTemplateModal()" style="background:none; border:none; cursor:pointer; color:#94a3b8; font-size:18px; line-height:1; padding:2px 6px;">&times;</button>
    </div>

    <input type="hidden" id="templateEditId" value="">

    <label class="panel-form-label">Template Name</label>
    <input type="text" id="templateName" class="panel-form-input" placeholder="e.g. School ID Card Footer" maxlength="100">

    <label class="panel-form-label">Instructions / Footer Text</label>
    <textarea id="templateInstructions" class="panel-form-input" rows="5"
      placeholder="Footer text printed at the bottom of PDF/Word exports..." maxlength="5000"></textarea>

    <label class="panel-form-label" style="display:flex; align-items:center; gap:8px; font-weight:500; cursor:pointer;">
      <input type="checkbox" id="templateIsDefault" style="accent-color:#667eea; width:14px; height:14px;">
      Set as default template
    </label>

    <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:20px;">
      <button class="btn btn-md btn-neutral" onclick="closeTemplateModal()">Cancel</button>
      <button class="btn btn-md btn-primary" onclick="saveTemplate()">
        <i class="fa-solid fa-check"></i> Save Template
      </button>
    </div>
  </div>
</div>
