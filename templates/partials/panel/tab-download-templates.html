{% load static %}
<!-- === DOWNLOAD TEMPLATES TAB === -->
<div class="panel-tab-content" id="tab-download-templates">

  <!-- Header bar -->
  <div class="notif-actions-bar">
    <div class="notif-actions-left">
      <p class="text-xs text-gray-500">Manage export templates used in PDF & Word downloads</p>
    </div>
    <div class="notif-actions-right">
      <button class="btn btn-md btn-primary" onclick="openCreateTemplateModal()">
        <i class="fa-solid fa-plus"></i> New Template
      </button>
    </div>
  </div>

  <!-- Templates Table -->
  <div class="notif-table-wrap">
    <table class="notif-table">
      <thead>
        <tr>
          <th scope="col" style="width:5%">#</th>
          <th scope="col" style="width:20%">Name</th>
          <th scope="col" style="width:45%">Instructions / Footer Text</th>
          <th scope="col" style="width:10%">Default</th>
          <th scope="col" style="width:10%">Created</th>
          <th scope="col" style="width:10%">Actions</th>
        </tr>
      </thead>
      <tbody id="templateTableBody">
        <tr class="notif-table-empty">
          <td colspan="6">
            <div class="empty-state">
              <i class="fa-solid fa-file-lines"></i>
              <p>No templates yet</p>
              <span>Create your first export template to get started</span>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Create / Edit Template Modal -->
<div class="center-modal-overlay center-modal-theme-blue" id="templateModal" onclick="if(event.target===this)closeTemplateModal()">
  <div class="center-modal-card" style="max-width:520px;" @click.stop>
    <!-- Header -->
    <div class="center-modal-header">
      <h3 id="templateModalTitle"><i class="fa-solid fa-file-lines"></i> New Template</h3>
      <button type="button" class="center-modal-header-close" onclick="closeTemplateModal()" title="Close">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <!-- Body -->
    <div class="center-modal-body-area text-left">
      <input type="hidden" id="templateEditId" value="">

      <label class="panel-form-label">Template Name *</label>
      <input type="text" id="templateName" class="panel-form-input" placeholder="e.g. School ID Card Footer" maxlength="100">

      <label class="panel-form-label">Instructions / Footer Text *</label>
      <textarea id="templateInstructions" class="panel-form-input" rows="5"
        placeholder="Footer text printed at the bottom of PDF/Word exports..."
        maxlength="5000"></textarea>

      <label class="panel-form-label checkbox-label">
        <input type="checkbox" id="templateIsDefault" class="checkbox-input">
        Set as default template
      </label>
    </div>
    <!-- Footer -->
    <div class="center-modal-footer-area">
      <button type="button" class="center-modal-btn center-modal-btn-cancel" onclick="closeTemplateModal()">Cancel</button>
      <button type="button" class="center-modal-btn center-modal-btn-confirm" onclick="saveTemplate()">
        <i class="fa-solid fa-check"></i> Save Template
      </button>
    </div>
  </div>
</div>
