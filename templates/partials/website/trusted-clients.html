{% load static %}
<!-- Trusted Clients Section (Seamless Loop) -->
{% if trusted_clients %}
<section class="trusted-schools" id="trusted">
    <div class="container">
        <h2 class="section-title">Trusted Clients</h2>
        <div class="logos-carousel">
            <div class="logos-track">
                {% for client in trusted_clients %}
                    <div class="logo-item">
                        <div class="logo-visual">
                            <img src="{{ client.website_logo.url }}" alt="{{ client.name }}" loading="lazy" decoding="async">
                        </div>
                        <span class="school-name" title="{{ client.name }}">{{ client.name }}</span>
                    </div>
                {% endfor %}
                <!-- Duplicate ALL items for seamless infinite loop -->
                {% for client in trusted_clients %}
                    <div class="logo-item" aria-hidden="true">
                        <div class="logo-visual">
                            <img src="{{ client.website_logo.url }}" alt="" loading="lazy" decoding="async">
                        </div>
                        <span class="school-name">{{ client.name }}</span>
                    </div>
                {% endfor %}
            </div>
        </div>
    </div>
</section>
{% endif %}
