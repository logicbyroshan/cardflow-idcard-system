{% load static %}
<section class="download-app-section" id="download-app">
    <div class="container">
        <div class="download-app-wrap">
            <div class="download-app-wrapper">
                <div class="download-app-content">
                    <div class="app-badge">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                    <span>Available on Play Store</span>
                </div>
                <h2>Manage Everything on the <span class="gradient-text">Go</span></h2>
                <p>Download our official mobile app to manage your orders, track deliveries, and browse our latest product range directly from your smartphone.</p>
                
                <div class="app-features">
                    <div class="app-feature">
                        <i class="fa-solid fa-circle-check"></i>
                        <span>Easy Order Tracking</span>
                    </div>
                    <div class="app-feature">
                        <i class="fa-solid fa-circle-check"></i>
                        <span>Instant Notifications</span>
                    </div>
                    <div class="app-feature">
                        <i class="fa-solid fa-circle-check"></i>
                        <span>Seamless Re-ordering</span>
                    </div>
                </div>

                <div class="app-buttons">
                    <a href="#" class="play-store-btn" target="_blank" rel="noopener noreferrer">
                        <div class="ps-icon">
                            <i class="fa-brands fa-google-play"></i>
                        </div>
                        <div class="ps-text">
                            <span>GET IT ON</span>
                            <strong>Google Play</strong>
                        </div>
                    </a>
                </div>
            </div>

            <div class="download-app-visual">
                <div class="phone-mockup">
                    <div class="phone-frame">
                        <div class="phone-screen">
                            <div class="app-slider">
                                <div class="app-slides">
                                    <img src="{% static 'assets/phone-ss/screenshots1.webp' %}" alt="App Screenshot 1" class="app-slide active" width="2064" height="1636" decoding="async">
                                    <img src="{% static 'assets/phone-ss/screenshots2.webp' %}" alt="App Screenshot 2" class="app-slide" width="2064" height="1636" loading="lazy" decoding="async">
                                    <img src="{% static 'assets/phone-ss/screenshots3.webp' %}" alt="App Screenshot 3" class="app-slide" width="2064" height="1636" loading="lazy" decoding="async">
                                    <img src="{% static 'assets/phone-ss/screenshots4.webp' %}" alt="App Screenshot 4" class="app-slide" width="2064" height="1636" loading="lazy" decoding="async">
                                    <img src="{% static 'assets/phone-ss/screenshots5.webp' %}" alt="App Screenshot 5" class="app-slide" width="2064" height="1636" loading="lazy" decoding="async">
                                    <img src="{% static 'assets/phone-ss/screenshots6.webp' %}" alt="App Screenshot 6" class="app-slide" width="2064" height="1636" loading="lazy" decoding="async">
                                    <img src="{% static 'assets/phone-ss/screenshots7.webp' %}" alt="App Screenshot 7" class="app-slide" width="2064" height="1636" loading="lazy" decoding="async">
                                    <img src="{% static 'assets/phone-ss/screenshots8.webp' %}" alt="App Screenshot 8" class="app-slide" width="2064" height="1636" loading="lazy" decoding="async">
                                </div>
                                <div class="app-slider-dots">
                                    <span class="dot active" data-slide="0"></span>
                                    <span class="dot" data-slide="1"></span>
                                    <span class="dot" data-slide="2"></span>
                                    <span class="dot" data-slide="3"></span>
                                    <span class="dot" data-slide="4"></span>
                                    <span class="dot" data-slide="5"></span>
                                    <span class="dot" data-slide="6"></span>
                                    <span class="dot" data-slide="7"></span>
                                </div>
                            </div>
                        </div>
                        <div class="phone-speaker"></div>
                        <div class="phone-camera"></div>
                        <div class="phone-flash"></div>
                    </div>
                    <div class="phone-shadow"></div>
                </div>
            </div>
        </div>
    </div>
</section>

<style>
/* Play Store Button */
.play-store-btn {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    background: linear-gradient(135deg, #000 0%, #1a1a1a 100%);
    color: #fff;
    padding: 14px 28px;
    border-radius: 16px;
    text-decoration: none;
    transition: all 0.3s ease;
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    font-weight: 600;
    position: relative;
    overflow: hidden;
}

.play-store-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transition: left 0.5s ease;
}

.play-store-btn:hover::before {
    left: 100%;
}

.play-store-btn:hover {
    background: linear-gradient(135deg, #1a1a1a 0%, #000 100%);
    transform: translateY(-4px);
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
}

.ps-icon i {
    font-size: 2.2rem;
    color: #fff;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
}

.ps-text {
    display: flex;
    flex-direction: column;
    line-height: 1.3;
}

.ps-text span {
    font-size: 0.75rem;
    font-weight: 500;
    opacity: 0.8;
}

.ps-text strong {
    font-size: 1.3rem;
    font-weight: 700;
}
/* Mobile App Section Styles */
.download-app-section {
    padding: 100px 0 120px;
    background: linear-gradient(180deg, #eef6ff 0%, #f8fbff 60%, #ffffff 100%);
    overflow: visible;
    position: relative;
}

.download-app-section::before {
    content: '';
    position: absolute;
    width: 620px;
    height: 620px;
    background: radial-gradient(circle, rgba(56, 189, 248, 0.14) 0%, transparent 65%);
    top: -260px;
    right: -180px;
    z-index: 0;
}

.download-app-section::after {
    content: '';
    position: absolute;
    width: 520px;
    height: 520px;
    background: radial-gradient(circle, rgba(16, 185, 129, 0.1) 0%, transparent 66%);
    bottom: -240px;
    left: -220px;
    z-index: 0;
}

.download-app-wrap {
    position: relative;
    max-width: 1280px;
    margin: 0 auto;
    padding: 40px 36px;
    background: #ffffff;
    border-radius: 40px;
    box-shadow: 0 40px 90px rgba(15, 23, 42, 0.12);
    overflow: visible;
    z-index: 1;
}

.download-app-wrapper {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(320px, 440px);
    align-items: center;
    gap: 48px;
    position: relative;
    z-index: 2;
}

.app-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(14, 134, 255, 0.12);
    color: #0f4fe0;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 0.9rem;
    font-weight: 700;
    margin-bottom: 22px;
    box-shadow: inset 0 0 0 1px rgba(14, 134, 255, 0.18);
}

.download-app-content {
    max-width: 620px;
}

.download-app-content h2 {
    font-size: clamp(3rem, 4vw, 4.2rem);
    font-weight: 900;
    color: #0f172a;
    margin-bottom: 22px;
    line-height: 1.05;
}

.download-app-content p {
    font-size: 1.15rem;
    color: #475569;
    margin-bottom: 36px;
    line-height: 1.75;
    max-width: 520px;
}

.app-features {
    display: grid;
    gap: 14px;
    margin-bottom: 40px;
}

.app-feature {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 600;
    color: #475569;
}

.app-feature i {
    color: #10b981;
    font-size: 1rem;
    width: 24px;
    min-width: 24px;
    text-align: center;
}

.app-buttons {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
}

.play-store-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 56px;
    padding: 0 30px;
    background: linear-gradient(135deg, #0f4fe0 0%, #10b981 100%);
    color: #ffffff;
    border-radius: 18px;
    font-size: 1rem;
    font-weight: 700;
    border: none;
    box-shadow: 0 18px 45px rgba(16, 185, 129, 0.24);
    transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
    text-decoration: none;
}

.play-store-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 24px 55px rgba(16, 185, 129, 0.28);
    filter: saturate(1.05);
}

.play-store-btn i {
    font-size: 1.2rem;
}

.play-store-btn span {
    display: inline-block;
}

.play-store-btn img {
    display: none;
}

/* Phone Mockup */
.phone-mockup {
    position: relative;
    width: 320px;
    margin: 0 auto;
    perspective: 1000px;
}

.phone-frame {
    width: 320px;
    height: 640px;
    background: linear-gradient(145deg, #1e293b 0%, #334155 50%, #0f172a 100%);
    border-radius: 44px;
    padding: 16px;
    position: relative;
    box-shadow: 0 50px 100px -20px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05);
    border: 2px solid rgba(255,255,255,0.1);
}

.phone-screen {
    width: 100%;
    height: 100%;
    background: linear-gradient(145deg, #000000 0%, #1a1a1a 100%);
    border-radius: 36px;
    overflow: hidden;
    position: relative;
    border: 1px solid rgba(255,255,255,0.05);
}

.phone-speaker {
    position: absolute;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 8px;
    background: linear-gradient(90deg, #0f172a 0%, #334155 50%, #0f172a 100%);
    border-radius: 12px;
    z-index: 10;
    border: 1px solid rgba(255,255,255,0.1);
}

.phone-camera {
    position: absolute;
    top: 25px;
    right: 60px;
    width: 16px;
    height: 16px;
    background: linear-gradient(145deg, #2a2a2a 0%, #1a1a1a 100%);
    border-radius: 50%;
    z-index: 10;
    border: 2px solid #334155;
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.1);
}

.phone-flash {
    position: absolute;
    top: 30px;
    right: 35px;
    width: 8px;
    height: 8px;
    background: linear-gradient(145deg, #ffd700 0%, #ffb347 100%);
    border-radius: 50%;
    z-index: 10;
    border: 1px solid #334155;
    box-shadow: 0 0 4px rgba(255,215,0,0.3);
}

.phone-button {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 50px;
    height: 50px;
    border: 3px solid #334155;
    border-radius: 50%;
    z-index: 10;
    background: linear-gradient(145deg, #1e293b 0%, #334155 100%);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.3), 0 0 0 1px rgba(255,255,255,0.05);
    cursor: pointer;
    transition: all 0.2s ease;
}

.phone-button:hover {
    background: linear-gradient(145deg, #334155 0%, #1e293b 100%);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.2), 0 0 0 1px rgba(255,255,255,0.1);
}

.phone-button::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 20px;
    height: 20px;
    background: linear-gradient(145deg, #4a5568 0%, #2d3748 100%);
    border-radius: 50%;
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.1);
}

.app-slider {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
}

.app-slides {
    width: 100%;
    height: 100%;
    position: relative;
}

.app-slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #fff;
    opacity: 0;
    transform: scale(0.95);
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
}

.app-slide.active {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
}

.app-slider-dots {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 10;
}

.app-slider-dots .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.4);
    cursor: pointer;
    transition: all 0.3s ease;
    border: none;
}

.app-slider-dots .dot.active {
    background: #fff;
    transform: scale(1.2);
}

.app-slider-dots .dot:hover {
    background: rgba(255, 255, 255, 0.7);
}

.phone-shadow {
    position: absolute;
    bottom: -42px;
    left: 50%;
    transform: translateX(-50%);
    width: 94%;
    height: 28px;
    background: rgba(15, 23, 42, 0.16);
    filter: blur(22px);
    border-radius: 50%;
    z-index: 0;
}

/* Responsive */
@media (max-width: 991px) {
    .download-app-wrapper {
        grid-template-columns: 1fr;
        text-align: center;
        gap: 40px;
    }
    
    .app-badge {
        justify-content: center;
    }
    
    .app-features {
        justify-items: center;
    }
    
    .download-app-content h2 {
        font-size: 2.5rem;
    }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const slides = document.querySelectorAll('.app-slide');
    const dots = document.querySelectorAll('.app-slider-dots .dot');
    let currentSlide = 0;
    let slideInterval;

    function showSlide(index) {
        // Hide all slides
        slides.forEach(slide => slide.classList.remove('active'));
        dots.forEach(dot => dot.classList.remove('active'));

        // Show current slide
        slides[index].classList.add('active');
        dots[index].classList.add('active');

        currentSlide = index;
    }

    function nextSlide() {
        currentSlide = (currentSlide + 1) % slides.length;
        showSlide(currentSlide);
    }

    function startAutoSlide() {
        slideInterval = setInterval(nextSlide, 3000); // Change slide every 3 seconds
    }

    function stopAutoSlide() {
        clearInterval(slideInterval);
    }

    // Add click event to dots
    dots.forEach((dot, index) => {
        dot.addEventListener('click', () => {
            showSlide(index);
            stopAutoSlide();
            startAutoSlide(); // Restart auto-slide after manual interaction
        });
    });

    // Pause auto-slide on hover
    const slider = document.querySelector('.app-slider');
    slider.addEventListener('mouseenter', stopAutoSlide);
    slider.addEventListener('mouseleave', startAutoSlide);

    // Start auto-slide
    startAutoSlide();
});
</script>
