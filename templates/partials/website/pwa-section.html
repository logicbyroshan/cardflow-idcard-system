{% load static %}
<!-- Install Our App (PWA) Section -->
<section class="download-app-section" id="download-app">
    <div class="container">
        <div class="download-app-wrapper">
            <div class="download-app-content">
                <h2>Get Our App</h2>
                <p>Install our Progressive Web App directly on your device — no app store needed. Manage orders, track deliveries, and access your dashboard instantly.</p>
                <div class="pwa-features">
                    <div class="pwa-feature">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        <span>Lightning Fast</span>
                    </div>
                    <div class="pwa-feature">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        <span>Secure & Private</span>
                    </div>
                    <div class="pwa-feature">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="5" y="2" width="14" height="20" rx="2" stroke="currentColor" stroke-width="2"/><line x1="12" y1="18" x2="12" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                        <span>Works Offline</span>
                    </div>
                </div>
                <div class="download-app-buttons">
                    <a href="/app/" class="pwa-install-btn" id="pwaInstallBtn">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="5" y="2" width="14" height="20" rx="2" stroke="currentColor" stroke-width="2"/><line x1="12" y1="18" x2="12" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                        Open App
                    </a>
                    <p class="pwa-hint">Login required · Works best on mobile</p>
                </div>
            </div>
            <div class="download-app-visual">
                <div class="pwa-phone-mockup">
                    <div class="phone-screen">
                        <div class="phone-statusbar"></div>
                        <div class="phone-content">
                            <div class="phone-logo">
                                <svg width="40" height="40" viewBox="0 0 60 60" fill="none"><rect width="60" height="60" rx="14" fill="#0A92DD"/><rect x="10" y="14" width="40" height="28" rx="4" fill="white" opacity="0.9"/><circle cx="22" cy="25" r="6" fill="#dbeafe"/><rect x="32" y="20" width="14" height="3" rx="1.5" fill="#93c5fd"/><rect x="32" y="26" width="10" height="3" rx="1.5" fill="#bfdbfe"/><rect x="14" y="35" width="32" height="3" rx="1.5" fill="#eff6ff"/></svg>
                            </div>
                            <div class="phone-text">Adarsh ID Cards</div>
                            <div class="phone-dots"><span></span><span></span><span></span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
