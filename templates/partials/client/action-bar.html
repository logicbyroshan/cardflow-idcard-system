    <!-- Action Bar -->
    <div class="action-bar">
        
        <!-- Left Section - Filter and Search -->
        <div class="action-bar-left">
            <div class="filter-group">
                <div class="custom-dropdown" id="filterDropdown">
                    <button class="dropdown-toggle" id="dropdownToggle" aria-expanded="false">
                        <span id="selectedText">All</span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="dropdown-options" id="dropdownOptions">
                        <div class="dropdown-option selected" data-value="all">All</div>
                        <div class="dropdown-option" data-value="name">Name</div>
                        <div class="dropdown-option" data-value="email">Email</div>
                        <div class="dropdown-option" data-value="mobile">Mobile</div>
                    </div>
                </div>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" placeholder="Search All..." class="search-input" autocomplete="off">
                <button class="search-clear-btn" id="searchClearBtn" type="button" title="Clear search" aria-label="Clear search">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </div>

        <!-- Right Section - Action Buttons -->
        <div class="action-bar-right">
            <div class="actions">
                <div class="btn-group">
                    {% if is_super_admin %}
                    <button class="btn btn-md btn-primary" id="addClientBtn"><i class="fa-solid fa-plus"></i> Add</button>
                    {% endif %}
                    <button class="btn btn-md btn-neutral" id="editClientBtn" disabled><i class="fa-solid fa-pen"></i> Edit</button>
                    <button class="btn btn-md btn-neutral" id="viewClientBtn" disabled><i class="fa-solid fa-eye"></i> View</button>
                    <button class="btn btn-md btn-neutral" id="viewStaffBtn" disabled><i class="fa-solid fa-users"></i> Staff</button>
                </div>
                {% if is_super_admin %}
                <div class="btn-separator"></div>
                <div class="btn-group">
                    <button class="btn btn-md btn-danger" id="deleteClientBtn" disabled><i class="fa-solid fa-trash"></i> Delete</button>
                    <button class="btn btn-md btn-warning" id="activeClientBtn" disabled><i class="fa-solid fa-check"></i> Active</button>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
