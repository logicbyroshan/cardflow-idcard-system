    <!-- Delete Confirmation Modal (Center Modal) -->
    <div id="delete-modal" class="modal-backdrop"
         x-show="activeModal === 'delete'" x-transition.opacity
         style="display:none">
      <div class="modal-center modal-danger" @click.stop
           x-show="activeModal === 'delete'" x-transition.scale.origin.center>
        <div class="modal-header">
          <h3><i class="fa-solid fa-triangle-exclamation"></i> Confirm Delete</h3>
          <button class="modal-close" type="button" aria-label="Close delete modal"
                  @click="closeModal()">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="modal-body">
          <div class="flex flex-col items-center text-center py-2">
            <div class="w-10 h-10 rounded-sm bg-danger-bg flex items-center justify-center mb-2">
              <i class="fa-solid fa-trash-can text-danger text-sm"></i>
            </div>
            <p class="text-sm text-gray-700">Are you sure you want to delete <strong id="deleteClientName">this client</strong>?</p>
            <p class="text-gray-400 mt-1 flex items-center gap-1 text-xs"><i class="fa-solid fa-exclamation-circle"></i> This action cannot be undone.</p>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-md btn-neutral" type="button"
                  @click="closeModal()">
            <i class="fa-solid fa-xmark"></i> Cancel
          </button>
          <button class="btn btn-md btn-danger" id="confirmDeleteBtn" type="button">
            <i class="fa-solid fa-trash-can"></i> Delete
          </button>
        </div>
      </div>
    </div>
