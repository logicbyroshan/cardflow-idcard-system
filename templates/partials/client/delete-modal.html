    <!-- Delete Confirmation Modal (Center Modal) -->
    <div id="delete-modal" class="modal-backdrop"
         x-show="activeModal === 'delete'" x-transition.opacity
         style="display:none">
      <div class="modal-center modal-danger" @click.stop
           x-show="activeModal === 'delete'" x-transition.scale.origin.center>
        <div class="modal-header">
          <h3><i class="fa-solid fa-triangle-exclamation"></i> Confirm Delete</h3>
          <button class="modal-close" type="button" aria-label="Close delete modal"
                  @click="closeModal()">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="modal-body">
          <div class="flex flex-col items-center text-center" style="padding:18px 12px 8px">
            <div style="width:52px;height:52px;border-radius:50%;background:var(--color-danger-bg,#fee2e2);display:flex;align-items:center;justify-content:center;margin-bottom:14px">
              <i class="fa-solid fa-trash-can" style="font-size:22px;color:var(--color-danger,#ef4444)"></i>
            </div>
            <p style="font-size:15px;font-weight:600;color:#1f2937;margin:0 0 4px">Delete Client?</p>
            <p style="font-size:13px;color:#6b7280;margin:0 0 14px">
              You are about to delete <strong id="deleteClientName" style="color:#1f2937">this client</strong>.
            </p>
            <div style="width:100%;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:10px 14px;text-align:left">
              <p style="font-size:12px;color:#991b1b;font-weight:600;margin:0 0 6px;display:flex;align-items:center;gap:6px">
                <i class="fa-solid fa-circle-exclamation"></i> Warning
              </p>
              <ul style="margin:0;padding:0 0 0 16px;font-size:12px;color:#7f1d1d;line-height:1.7">
                <li>Client profile and all related data will be removed</li>
                <li>All ID cards for this client will be deleted</li>
                <li>This action cannot be undone</li>
              </ul>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-md btn-neutral" type="button"
                  @click="closeModal()">
            <i class="fa-solid fa-xmark"></i> Cancel
          </button>
          <button class="btn btn-md btn-danger" id="confirmDeleteBtn" type="button">
            <i class="fa-solid fa-trash-can"></i> Delete
          </button>
        </div>
      </div>
    </div>
