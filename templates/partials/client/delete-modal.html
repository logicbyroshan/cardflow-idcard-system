    <!-- Delete Confirmation Modal (Center Modal) -->
    <div id="delete-modal" class="modal-backdrop"
         x-show="activeModal === 'delete'" x-transition.opacity
         style="display:none">
      <div class="modal-center modal-danger" @click.stop
           x-show="activeModal === 'delete'" x-transition.scale.origin.center>
        <div class="modal-header">
          <h3><i class="fa-solid fa-triangle-exclamation"></i> Confirm Delete</h3>
          <button class="modal-close" type="button" aria-label="Close delete modal"
                  @click="closeModal()">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="modal-body">
          <div class="flex flex-col items-center text-center" style="padding:18px 12px 8px">
            <div style="width:52px;height:52px;border-radius:50%;background:var(--color-danger-bg,#fee2e2);display:flex;align-items:center;justify-content:center;margin-bottom:14px">
              <i class="fa-solid fa-trash-can" style="font-size:22px;color:var(--color-danger,#ef4444)"></i>
            </div>
            <p style="font-size:15px;font-weight:600;color:#1f2937;margin:0 0 4px">Delete Client?</p>
            <p style="font-size:13px;color:#6b7280;margin:0 0 14px">
              You are about to delete <strong id="deleteClientName" style="color:#1f2937">this client</strong>.
            </p>
            <div style="width:100%;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:10px 14px;text-align:left">
              <p style="font-size:12px;color:#991b1b;font-weight:600;margin:0 0 6px;display:flex;align-items:center;gap:6px">
                <i class="fa-solid fa-circle-exclamation"></i> Warning
              </p>
              <ul style="margin:0;padding:0 0 0 16px;font-size:12px;color:#7f1d1d;line-height:1.7">
                <li>Client profile and all related data will be removed</li>
                <li>All ID cards for this client will be deleted</li>
                <li>This action cannot be undone</li>
              </ul>
            </div>
            <!-- 6-digit confirmation code -->
            <div style="width:100%;margin-top:16px;">
              <p style="font-size:12px;color:#6b7280;text-align:center;margin:0 0 8px;">Type this code to confirm:</p>
              <div style="font-size:32px;font-weight:800;letter-spacing:8px;color:#dc2626;font-family:monospace;text-align:center;padding:10px 20px;background:#fef2f2;border:2px dashed #fca5a5;border-radius:10px;margin-bottom:12px;user-select:all;"
                   x-text="deleteCode || '------'"></div>
              <input type="text" x-model="deleteCodeInput"
                  maxlength="6"
                  inputmode="numeric"
                  pattern="[0-9]{6}"
                  placeholder="_ _ _ _ _ _"
                  autocomplete="off"
                  style="width:100%;padding:10px 12px;border:2px solid #d1d5db;border-radius:8px;font-size:22px;letter-spacing:6px;text-align:center;font-family:monospace;font-weight:700;outline:none;transition:border-color .15s, box-shadow .15s;box-sizing:border-box;"
                  oninput="this.value=this.value.replace(/[^0-9]/g,'')"
                  :style="deleteCodeInput.length===0 ? 'border-color:#d1d5db' : (deleteCodeInput===deleteCode ? 'border-color:#86efac;box-shadow:0 0 0 3px rgba(134,239,172,0.2)' : 'border-color:#fca5a5;box-shadow:0 0 0 3px rgba(252,165,165,0.2)')"
                  @focus="$el.style.borderColor='#667eea'; $el.style.boxShadow='0 0 0 3px rgba(102,126,234,0.15)'"
                  @blur="$el.style.borderColor=deleteCodeInput.length===0?'#d1d5db':(deleteCodeInput===deleteCode?'#86efac':'#fca5a5'); $el.style.boxShadow=''"
              >
              <p style="font-size:12px;color:#dc2626;margin:6px 0 0;text-align:center;font-weight:500;"
                 x-show="deleteCodeInput.length===6 && deleteCodeInput!==deleteCode">
                <i class="fa-solid fa-circle-xmark"></i> Incorrect code. Please try again.
              </p>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-md btn-neutral" type="button"
                  @click="closeModal()">
            <i class="fa-solid fa-xmark"></i> Cancel
          </button>
          <button class="btn btn-md btn-danger" id="confirmDeleteBtn" type="button"
                  :disabled="!(deleteCodeInput && deleteCodeInput.length===6 && deleteCodeInput===deleteCode)">
            <i class="fa-solid fa-trash-can"></i> Delete
          </button>
        </div>
      </div>
    </div>
