<style>
  .group-msg-layout {
    display: grid;
    grid-template-columns: minmax(260px, 320px) minmax(0, 1fr);
    gap: 12px;
    min-height: 0;
    height: 100%;
  }

  .group-msg-panel {
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    background: #fff;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .group-msg-panel-head {
    padding: 10px 12px;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: #f8fafc;
  }

  .group-msg-panel-body {
    padding: 10px;
    min-height: 0;
    overflow: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .group-msg-clients-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .group-msg-client-row {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 8px;
    background: #fff;
    cursor: pointer;
    transition: border-color 0.15s ease, background-color 0.15s ease;
  }

  .group-msg-client-row:hover {
    border-color: #bfdbfe;
    background: #f8fbff;
  }

  .group-msg-client-row.active {
    border-color: #60a5fa;
    background: #eff6ff;
  }

  .group-msg-client-meta {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
  }

  .group-msg-client-name {
    color: #1e293b;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .group-msg-client-sub {
    color: #64748b;
    font-size: 11px;
  }

  .group-msg-controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .group-msg-radio {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #334155;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 5px 10px;
    background: #fff;
  }

  .group-msg-composer {
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    background: #fff;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .group-msg-options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .group-msg-option-title {
    font-size: 12px;
    color: #64748b;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .group-msg-action-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    border-top: 1px solid #e2e8f0;
    padding-top: 10px;
  }

  .group-msg-action-buttons {
    display: inline-flex;
    gap: 8px;
  }

  .group-msg-btn {
    border-radius: 9px !important;
  }

  .group-msg-chat-body {
    flex: 1;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    background: #f8fafc;
    min-height: 140px;
    max-height: 280px;
    overflow: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .group-msg-footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    flex-wrap: wrap;
  }

  @media (max-width: 980px) {
    .group-msg-layout {
      grid-template-columns: 1fr;
      height: auto;
    }

    .group-msg-chat-body {
      max-height: 220px;
    }

    .group-msg-options-grid {
      grid-template-columns: 1fr;
    }
  }
</style>

<div id="group-message-drawer" class="drawer-modal">
  <div class="drawer-content drawer-wide" style="width:min(1100px,100vw);">
    <div class="drawer-header">
      <h3>
        <i class="fa-solid fa-paper-plane"></i>
        <span>Client Message</span>
      </h3>
      <button class="drawer-close" id="closeGroupMessageDrawer" aria-label="Close message drawer">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="drawer-body" style="display:flex;flex-direction:column;gap:12px;min-height:0;">
      <div class="group-msg-layout">
        <section class="group-msg-panel">
          <div class="group-msg-panel-head">
            <div style="font-size:12px;font-weight:700;color:#334155;">Clients</div>
            <div id="groupMessageSelectedCount" style="font-size:11px;color:#64748b;">All clients (default)</div>
          </div>
          <div class="group-msg-panel-body">
            <div style="display:flex;gap:8px;">
              <input type="text" id="groupMessageClientSearch" class="form-input" placeholder="Search clients..." style="flex:1;">
              <button type="button" class="btn btn-sm btn-neutral" id="refreshGroupMessageClientsBtn" title="Refresh clients">
                <i class="fa-solid fa-rotate"></i>
              </button>
            </div>

            <div class="group-msg-controls">
              <button type="button" class="btn btn-sm btn-neutral" id="groupMessageSelectAllVisibleBtn">Select Visible</button>
              <button type="button" class="btn btn-sm btn-neutral" id="groupMessageClearSelectionBtn">Clear</button>
            </div>

            <div id="groupMessageClientsList" class="group-msg-clients-list"></div>
          </div>
        </section>

        <section class="group-msg-panel">
          <div class="group-msg-panel-head">
            <div style="display:flex;flex-direction:column;min-width:0;">
              <div style="font-size:12px;color:#64748b;font-weight:600;">Message Panel</div>
              <div id="groupMessageTargetSummary" style="font-size:13px;color:#0f172a;font-weight:700;">Sending to all clients</div>
            </div>
            <button type="button" class="btn btn-sm btn-neutral" id="refreshGroupMessageHistoryBtn" title="Refresh selected client history">
              <i class="fa-solid fa-clock-rotate-left"></i>
            </button>
          </div>
          <div class="group-msg-panel-body" style="gap:10px;">
            <div id="groupMessageHistory" class="group-msg-chat-body">
              <div style="text-align:center;padding:18px 10px;color:#64748b;font-size:13px;">Select a client from the left list to view message history.</div>
            </div>

            <div class="group-msg-composer">
              <div class="form-group" style="margin:0;">
                <label class="form-label" for="groupMessageText">Message</label>
                <textarea class="form-textarea" id="groupMessageText" rows="5" maxlength="2000" placeholder="Type your message..."></textarea>
                <div id="groupMessageCounter" style="font-size:11px;color:#64748b;text-align:right;">0 / 2000</div>
              </div>

              <div class="group-msg-options-grid">
                <div>
                  <div class="group-msg-option-title">Send To</div>
                  <div class="group-msg-controls">
                    <label class="group-msg-radio">
                      <input type="radio" name="groupMessageScope" value="client_only" checked>
                      <span>Client Only</span>
                    </label>
                    <label class="group-msg-radio">
                      <input type="radio" name="groupMessageScope" value="client_and_staff">
                      <span>Client + Staff</span>
                    </label>
                  </div>
                </div>

                <div>
                  <div class="group-msg-option-title">Message Type</div>
                  <div class="group-msg-controls">
                    <label class="group-msg-radio">
                      <input type="radio" name="groupMessageVisibility" value="permanent" checked>
                      <span>Permanent</span>
                    </label>
                    <label class="group-msg-radio">
                      <input type="radio" name="groupMessageVisibility" value="temporary">
                      <span>Temporary</span>
                    </label>
                  </div>
                </div>
              </div>

              <div class="group-msg-action-row">
                <div class="form-group" id="groupMessageDurationWrap" style="display:none;margin:0;min-width:220px;">
                  <label class="form-label" for="groupMessageTemporaryDuration">Temporary Duration</label>
                  <select id="groupMessageTemporaryDuration" class="form-select">
                    <option value="6h">6 hours</option>
                    <option value="12h">12 hours</option>
                    <option value="24h">24 hours</option>
                    <option value="2d">2 days</option>
                    <option value="3d">3 days</option>
                    <option value="7d">7 days</option>
                  </select>
                </div>

                <div class="group-msg-action-buttons">
                  <button type="button" class="btn btn-md btn-neutral group-msg-btn" id="cancelGroupMessageBtn">
                    <i class="fa-solid fa-xmark"></i> Close
                  </button>
                  <button type="button" class="btn btn-md btn-primary group-msg-btn" id="sendGroupMessageBtn">
                    <i class="fa-solid fa-paper-plane"></i> Send Message
                  </button>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
</div>
