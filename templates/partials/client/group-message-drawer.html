<style>
  #group-message-drawer {
    --msg-surface: #ffffff;
    --msg-surface-soft: #f8fbff;
    --msg-border: #d9e8f7;
    --msg-text: #16324a;
    --msg-muted: #5d7892;
    --msg-accent: #1f8cf0;
    --msg-accent-2: #2ec8b8;
    --msg-shadow: 0 14px 34px rgba(14, 45, 82, 0.18);
    --msg-scroll-track: #e8f1fb;
    --msg-scroll-thumb: linear-gradient(180deg, #4dbcf7 0%, #2fa2f2 55%, #2dc5b9 100%);
  }

  #group-message-drawer::before {
    background: rgba(9, 20, 36, 0.42);
    backdrop-filter: blur(2px);
  }

  #group-message-drawer .drawer-content {
    height: 100%;
    max-height: 100vh;
    display: flex;
    flex-direction: column;
    border-left: 0;
    box-shadow: var(--msg-shadow);
    background: linear-gradient(180deg, #f4f9ff 0%, #eef6ff 100%);
  }

  #group-message-drawer .drawer-header {
    background: linear-gradient(120deg, #0f5fae 0%, #1d80df 48%, #24b9b9 100%);
    border-bottom: 0;
    box-shadow: inset 0 -1px 0 rgba(255, 255, 255, 0.22);
  }

  #group-message-drawer .drawer-header h3 {
    letter-spacing: 0.2px;
  }

  #group-message-drawer .drawer-close {
    width: 34px;
    height: 34px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.14);
    border: 1px solid rgba(255, 255, 255, 0.2);
  }

  #group-message-drawer .drawer-close:hover {
    background: rgba(255, 255, 255, 0.24);
  }

  #group-message-drawer .drawer-body {
    flex: 1;
    min-height: 0;
    padding: 12px 14px;
    overflow: hidden;
    background: radial-gradient(circle at top right, rgba(79, 172, 254, 0.1), rgba(0, 0, 0, 0) 32%),
                radial-gradient(circle at bottom left, rgba(46, 200, 184, 0.09), rgba(0, 0, 0, 0) 30%);
  }

  .group-msg-layout {
    display: grid;
    grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);
    gap: 12px;
    flex: 1;
    min-height: 0;
    height: auto;
  }

  .group-msg-panel {
    border: 1px solid var(--msg-border);
    border-radius: 14px;
    background: color-mix(in srgb, var(--msg-surface) 90%, #f0f9ff 10%);
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 6px 14px rgba(15, 94, 160, 0.08);
  }

  .group-msg-panel:first-child,
  .group-msg-panel:last-child {
    padding: 0;
    border-right: 1px solid var(--msg-border);
  }

  .group-msg-panel-head {
    padding: 10px 12px;
    border-bottom: 1px solid var(--msg-border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 6px;
    background: linear-gradient(180deg, #ffffff 0%, #f7fbff 100%);
  }

  .group-msg-panel-head-right {
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }

  .group-msg-top-controls {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: flex-end;
  }

  .group-msg-top-control-row {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    flex-wrap: wrap;
  }

  .group-msg-inline-title {
    font-size: 11px;
    color: var(--msg-muted);
    font-weight: 700;
    margin-right: 3px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .group-msg-panel-body {
    padding: 10px;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .group-msg-controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .group-msg-radio {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #234760;
    border: 1px solid #d2e7fb;
    border-radius: 999px;
    padding: 5px 10px;
    background: #f5fbff;
    transition: background-color 0.18s ease, border-color 0.18s ease;
  }

  .group-msg-radio:has(input:checked) {
    background: #e7f4ff;
    border-color: #88c7ff;
    box-shadow: inset 0 0 0 1px rgba(53, 135, 214, 0.16);
  }

  .group-msg-radio input[type="radio"] {
    accent-color: #2f95ef;
  }

  .group-msg-search-row {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .group-msg-search-row .form-input {
    flex: 1;
    min-width: 0;
    height: 34px;
    border-radius: 9px;
    border-color: #cfe2f5;
    background: #fcfeff;
  }

  .group-msg-search-row .form-input:focus {
    border-color: #73b6f8;
    box-shadow: 0 0 0 3px rgba(54, 144, 236, 0.18);
  }

  #groupMessageSelectAllVisibleBtn,
  #groupMessageClearSelectionBtn {
    border-radius: 9px !important;
    border-color: #cfe2f5 !important;
    background: #f8fbff !important;
    color: #325779 !important;
    transition: all 0.18s ease;
  }

  #groupMessageSelectAllVisibleBtn:hover,
  #groupMessageClearSelectionBtn:hover {
    background: #edf6ff !important;
    border-color: #9ecdf7 !important;
    color: #1c4c76 !important;
  }

  .group-msg-clients-list {
    border: 1px solid #cfe2f5;
    border-radius: 12px;
    overflow: auto;
    min-height: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px;
    background: linear-gradient(180deg, #fbfdff 0%, #f4f9ff 100%);
  }

  .group-msg-client-row {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    box-sizing: border-box;
    border: 1px solid #e0edf9;
    border-radius: 10px;
    padding: 9px 10px;
    background: #ffffff;
    cursor: pointer;
    position: relative;
    transition: transform 0.14s ease, box-shadow 0.14s ease, background-color 0.14s ease;
  }

  .group-msg-client-row.selected {
    background: linear-gradient(90deg, #eaf5ff 0%, #f3fbff 100%);
    border-color: #78b9f7;
    box-shadow: 0 0 0 1px rgba(46, 134, 224, 0.18);
    padding-left: 18px;
    padding-right: 34px;
  }

  .group-msg-client-row.selected::before {
    content: "";
    position: absolute;
    left: 7px;
    top: 8px;
    bottom: 8px;
    width: 4px;
    border-radius: 999px;
    background: linear-gradient(180deg, #318de6 0%, #35bea8 100%);
  }

  .group-msg-client-row.selected::after {
    content: "✓";
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: #ffffff;
    background: linear-gradient(160deg, #2f95ef 0%, #2ebca9 100%);
    box-shadow: 0 3px 8px rgba(42, 135, 217, 0.35);
  }

  .group-msg-client-row:hover {
    background: #f6fbff;
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(37, 124, 205, 0.14);
  }

  .group-msg-client-row.active {
    border-color: #6fb3f5;
    box-shadow: 0 0 0 2px rgba(43, 144, 235, 0.24);
    background: #eaf5ff;
  }

  .group-msg-client-row.selected.active {
    border-color: #3c9bec;
    box-shadow: 0 0 0 2px rgba(31, 132, 224, 0.33), 0 5px 13px rgba(37, 124, 205, 0.2);
  }

  .group-msg-client-meta {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
  }

  .group-msg-client-name {
    color: var(--msg-text);
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .group-msg-client-sub {
    color: var(--msg-muted);
    font-size: 11px;
  }

  .group-msg-client-row.selected .group-msg-client-name {
    color: #124f83;
  }

  .group-msg-client-row.selected .group-msg-client-sub {
    color: #356585;
  }

  .group-msg-chat-body {
    flex: 1;
    border: 1px solid #cfe2f5;
    border-radius: 12px;
    background: linear-gradient(180deg, #fcfeff 0%, #f4f9ff 100%);
    min-height: 0;
    max-height: none;
    overflow: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .group-msg-composer {
    border: 1px solid #cfe2f5;
    border-radius: 12px;
    background: #ffffff;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: auto;
  }

  #groupMessageText {
    border-radius: 10px;
    border-color: #cfe2f5;
    background: #fcfeff;
    resize: vertical;
    min-height: 112px;
  }

  #groupMessageText:focus {
    border-color: #73b6f8;
    box-shadow: 0 0 0 3px rgba(54, 144, 236, 0.18);
  }

  .group-msg-action-row {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    flex-wrap: wrap;
    border-top: 0;
    padding-top: 0;
  }

  .group-msg-action-buttons {
    display: inline-flex;
    gap: 8px;
  }

  .group-msg-btn {
    border-radius: 10px !important;
    min-height: 36px;
  }

  #sendGroupMessageBtn {
    background: linear-gradient(130deg, var(--msg-accent) 0%, var(--msg-accent-2) 100%) !important;
    border: 0 !important;
    color: #ffffff !important;
    box-shadow: 0 8px 18px rgba(31, 140, 240, 0.34);
  }

  #sendGroupMessageBtn:hover {
    filter: brightness(0.98);
    transform: translateY(-1px);
  }

  .group-msg-footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    flex-wrap: wrap;
  }

  #group-message-drawer .drawer-body,
  .group-msg-clients-list,
  .group-msg-chat-body,
  #groupMessageText {
    scrollbar-width: thin;
    scrollbar-color: #5cb5f6 var(--msg-scroll-track);
  }

  #group-message-drawer .drawer-body::-webkit-scrollbar,
  .group-msg-clients-list::-webkit-scrollbar,
  .group-msg-chat-body::-webkit-scrollbar,
  #groupMessageText::-webkit-scrollbar {
    width: 7px;
    height: 7px;
  }

  #group-message-drawer .drawer-body::-webkit-scrollbar-track,
  .group-msg-clients-list::-webkit-scrollbar-track,
  .group-msg-chat-body::-webkit-scrollbar-track,
  #groupMessageText::-webkit-scrollbar-track {
    background: var(--msg-scroll-track);
    border-radius: 999px;
  }

  #group-message-drawer .drawer-body::-webkit-scrollbar-thumb,
  .group-msg-clients-list::-webkit-scrollbar-thumb,
  .group-msg-chat-body::-webkit-scrollbar-thumb,
  #groupMessageText::-webkit-scrollbar-thumb {
    background: var(--msg-scroll-thumb);
    border-radius: 999px;
    border: 1px solid #eaf4ff;
  }

  #group-message-drawer .drawer-body::-webkit-scrollbar-thumb:hover,
  .group-msg-clients-list::-webkit-scrollbar-thumb:hover,
  .group-msg-chat-body::-webkit-scrollbar-thumb:hover,
  #groupMessageText::-webkit-scrollbar-thumb:hover {
    filter: brightness(0.94);
  }

  @media (max-width: 980px) {
    .group-msg-layout {
      grid-template-columns: 1fr;
      height: auto;
      gap: 10px;
    }

    .group-msg-panel:first-child,
    .group-msg-panel:last-child {
      border-right: 1px solid var(--msg-border);
    }

    .group-msg-panel-head-right {
      width: 100%;
      justify-content: space-between;
    }

    .group-msg-top-controls {
      align-items: flex-start;
    }

    .group-msg-top-control-row {
      justify-content: flex-start;
    }

    #group-message-drawer .drawer-body {
      overflow: auto;
      padding: 10px;
    }

    .group-msg-chat-body {
      flex: initial;
      min-height: 170px;
      max-height: 260px;
    }
  }
</style>

<div id="group-message-drawer" class="drawer-modal">
  <div class="drawer-content drawer-wide" style="width:min(1100px,100vw);">
    <div class="drawer-header">
      <h3>
        <i class="fa-solid fa-paper-plane"></i>
        <span>Client Message</span>
      </h3>
      <button class="drawer-close" id="closeGroupMessageDrawer" aria-label="Close message drawer">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="drawer-body" style="display:flex;flex-direction:column;gap:8px;min-height:0;">
      <div class="group-msg-layout">
        <section class="group-msg-panel">
          <div class="group-msg-panel-head">
            <div style="font-size:12px;font-weight:700;color:#334155;">Clients</div>
            <div id="groupMessageSelectedCount" style="font-size:11px;color:#64748b;">0 selected</div>
          </div>
          <div class="group-msg-panel-body">
            <div class="group-msg-search-row">
              <input type="text" id="groupMessageClientSearch" class="form-input" placeholder="Search clients...">
              <button type="button" class="btn btn-sm btn-neutral" id="groupMessageSelectAllVisibleBtn">Select All</button>
              <button type="button" class="btn btn-sm btn-neutral" id="groupMessageClearSelectionBtn">Clear</button>
            </div>

            <div id="groupMessageClientsList" class="group-msg-clients-list"></div>
          </div>
        </section>

        <section class="group-msg-panel">
          <div class="group-msg-panel-head">
            <div style="display:flex;flex-direction:column;min-width:0;">
              <div style="font-size:12px;color:#64748b;font-weight:600;">Message Panel</div>
              <div id="groupMessageTargetSummary" style="font-size:13px;color:#0f172a;font-weight:700;">Sending to all clients</div>
            </div>
            <div class="group-msg-panel-head-right">
              <div class="group-msg-top-controls">
                <div class="group-msg-top-control-row">
                  <span class="group-msg-inline-title">Send To</span>
                  <div class="group-msg-controls">
                    <label class="group-msg-radio">
                      <input type="radio" name="groupMessageScope" value="client_only" checked>
                      <span>Client Only</span>
                    </label>
                    <label class="group-msg-radio">
                      <input type="radio" name="groupMessageScope" value="client_and_staff">
                      <span>Client + Staff</span>
                    </label>
                  </div>
                </div>

                <div class="group-msg-top-control-row">
                  <span class="group-msg-inline-title">Message Type</span>
                  <div class="group-msg-controls">
                    <label class="group-msg-radio">
                      <input type="radio" name="groupMessageVisibility" value="permanent" checked>
                      <span>Permanent</span>
                    </label>
                    <label class="group-msg-radio">
                      <input type="radio" name="groupMessageVisibility" value="temporary">
                      <span>Temporary</span>
                    </label>
                  </div>

                  <div class="form-group" id="groupMessageDurationWrap" style="display:none;margin:0;min-width:160px;">
                    <select id="groupMessageTemporaryDuration" class="form-select" aria-label="Temporary duration">
                      <option value="6h">6 hours</option>
                      <option value="12h">12 hours</option>
                      <option value="24h">24 hours</option>
                      <option value="2d">2 days</option>
                      <option value="3d">3 days</option>
                      <option value="7d">7 days</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="group-msg-panel-body" style="gap:10px;">
            <div id="groupMessageHistory" class="group-msg-chat-body">
              <div style="text-align:center;padding:18px 10px;color:#64748b;font-size:13px;">Select a client from the left list to view message history.</div>
            </div>

            <div class="group-msg-composer">
              <div class="form-group" style="margin:0;">
                <label class="form-label" for="groupMessageText">Message</label>
                <textarea class="form-textarea" id="groupMessageText" rows="5" maxlength="2000" placeholder="Type your message..."></textarea>
                <div id="groupMessageCounter" style="font-size:11px;color:#64748b;text-align:right;">0 / 2000</div>
              </div>

              <div class="group-msg-action-row">
                <div class="group-msg-action-buttons">
                  <button type="button" class="btn btn-md btn-neutral group-msg-btn" id="cancelGroupMessageBtn">
                    <i class="fa-solid fa-xmark"></i> Close
                  </button>
                  <button type="button" class="btn btn-md btn-primary group-msg-btn" id="sendGroupMessageBtn">
                    <i class="fa-solid fa-paper-plane"></i> Send Message
                  </button>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
</div>
