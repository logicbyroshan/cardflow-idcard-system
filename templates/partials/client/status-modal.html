    <!-- Status Change Confirmation Modal (Center Modal) -->
    <div id="status-modal" class="modal-backdrop"
         x-show="activeModal === 'status'" x-transition.opacity
         style="display:none">
      <div class="modal-center modal-warning" @click.stop
           x-show="activeModal === 'status'" x-transition.scale.origin.center>
        <div class="modal-header" id="statusModalHeader">
          <h3><i class="fa-solid fa-toggle-on"></i> Confirm Status Change</h3>
          <button class="modal-close" type="button" aria-label="Close status modal"
                  @click="closeModal()">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="modal-body">
          <div class="flex flex-col items-center text-center py-2">
            <div class="w-10 h-10 rounded-sm bg-warning-bg flex items-center justify-center mb-2" id="statusModalIcon">
              <i class="fa-solid fa-toggle-on text-warning text-sm"></i>
            </div>
            <p id="statusModalMessage" class="text-sm text-gray-700">Are you sure you want to change the status of <strong id="statusClientName">this client</strong>?</p>
            <p class="text-gray-400 mt-1 flex items-center gap-1 text-xs" id="statusNote"><i class="fa-solid fa-info-circle"></i> This will affect client's login access.</p>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-md btn-neutral" type="button"
                  @click="closeModal()">
            <i class="fa-solid fa-xmark"></i> Cancel
          </button>
          <button class="btn btn-md btn-warning" id="confirmStatusBtn" type="button">
            <i class="fa-solid fa-check"></i> Confirm
          </button>
        </div>
      </div>
    </div>
