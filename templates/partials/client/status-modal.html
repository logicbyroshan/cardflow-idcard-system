    <!-- Status Change Confirmation Modal (Center Modal) -->
    <div id="status-modal" class="modal-backdrop"
         x-show="activeModal === 'status'" x-transition.opacity
         style="display:none">
      <div class="modal-center modal-warning" @click.stop
           x-show="activeModal === 'status'" x-transition.scale.origin.center>
        <div class="modal-header" id="statusModalHeader">
          <h3><i class="fa-solid fa-toggle-on"></i> Confirm Status Change</h3>
          <button class="modal-close" type="button" aria-label="Close status modal"
                  @click="closeModal()">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="modal-body">
          <div class="flex flex-col items-center text-center" style="padding:18px 12px 8px">
            <div style="width:52px;height:52px;border-radius:50%;background:var(--color-warning-bg,#fef9c3);display:flex;align-items:center;justify-content:center;margin-bottom:14px" id="statusModalIcon">
              <i class="fa-solid fa-toggle-on" style="font-size:22px;color:var(--color-warning,#f59e0b)"></i>
            </div>
            <p style="font-size:15px;font-weight:600;color:#1f2937;margin:0 0 4px">Change Status?</p>
            <p id="statusModalMessage" style="font-size:13px;color:#6b7280;margin:0 0 14px">
              You are about to change the status of <strong id="statusClientName" style="color:#1f2937">this client</strong>.
            </p>
            <div style="width:100%;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:10px 14px;text-align:left">
              <p style="font-size:12px;color:#92400e;font-weight:600;margin:0 0 6px;display:flex;align-items:center;gap:6px">
                <i class="fa-solid fa-info-circle"></i> Please Note
              </p>
              <ul style="margin:0;padding:0 0 0 16px;font-size:12px;color:#78350f;line-height:1.7" id="statusNote">
                <li>This will affect client's login access</li>
                <li>Changes will take effect immediately</li>
              </ul>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-md btn-neutral" type="button"
                  @click="closeModal()">
            <i class="fa-solid fa-xmark"></i> Cancel
          </button>
          <button class="btn btn-md btn-warning" id="confirmStatusBtn" type="button">
            <i class="fa-solid fa-check"></i> Confirm
          </button>
        </div>
      </div>
    </div>
