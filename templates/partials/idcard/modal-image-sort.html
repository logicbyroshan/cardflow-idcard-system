{% load custom_filters %}
<!-- Image Sort Modal -->
<div class="upload-modal-overlay" id="imageSortModalOverlay">
  <div class="upload-modal image-sort-modal">
    <div class="upload-modal-header">
      <h3><i class="fa-solid fa-image"></i> Image Sort</h3>
      <button class="upload-modal-close" id="closeImageSortModal" aria-label="Close image sort modal"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="upload-modal-body">
      <div class="image-sort-form">
        <div class="form-group">
          <label><i class="fa-solid fa-table-columns"></i> Select Image Column(s)</label>
          <div class="badge-checkbox-group" id="imageSortColumnGroup">
            {% for field in table.fields %}
              {% check_image_field field.type field.name as is_img %}
              {% if is_img %}
              <label class="badge-checkbox-label">
                <input type="checkbox" name="imageSortColumn" value="{{ field.name }}" class="hidden-checkbox">
                <span class="badge-item">{{ field.name|upper }}</span>
              </label>
              {% endif %}
            {% endfor %}
          </div>
        </div>
        <div class="form-group">
          <label><i class="fa-solid fa-filter"></i> Select Condition(s)</label>
          <div class="badge-checkbox-group" id="imageSortConditionGroup">
            <label class="badge-checkbox-label condition-complete">
              <input type="checkbox" name="imageSortCondition" value="complete" class="hidden-checkbox">
              <span class="badge-item"><i class="fa-solid fa-image"></i> Complete</span>
            </label>
            <label class="badge-checkbox-label condition-pending">
              <input type="checkbox" name="imageSortCondition" value="pending" class="hidden-checkbox">
              <span class="badge-item"><i class="fa-regular fa-clock"></i> Pending</span>
            </label>
            <label class="badge-checkbox-label condition-incomplete">
              <input type="checkbox" name="imageSortCondition" value="incomplete" class="hidden-checkbox">
              <span class="badge-item"><i class="fa-solid fa-image-portrait" style="opacity: 0.5;"></i> Incomplete</span>
            </label>
          </div>
        </div>
      </div>
    </div>
    <div class="upload-modal-footer">
      <button class="btn btn-md btn-neutral" id="clearImageSort"><i class="fa-solid fa-filter-circle-xmark"></i> Clear Filter</button>
      <button class="btn btn-md btn-primary" id="applyImageSort"><i class="fa-solid fa-check"></i> Apply Sort</button>
    </div>
  </div>
</div>
