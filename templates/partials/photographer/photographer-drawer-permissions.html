<!-- Photographer Permissions Section -->
<div class="form-section" id="staff-permissions-section">
    <div class="permission-header">
        <i class="fa-solid fa-shield-halved"></i> User Permission
    </div>
    
    <!-- ID Card Action List -->
    <div class="permission-category">
        <div class="category-title">
            <i class="fa-solid fa-list"></i> ID Card Action List
        </div>
        <div class="permissions-grid">
            <div class="permission-row">
                <label class="toggle-switch">
                    <input type="checkbox" name="perm_idcard_pending_list" id="perm-idcard-pending-list" checked>
                    <span class="toggle-slider"></span>
                </label>
                <span class="permission-label">Pending List</span>
            </div>
            <div class="permission-row">
                <label class="toggle-switch">
                    <input type="checkbox" name="perm_idcard_verified_list" id="perm-idcard-verified-list" checked>
                    <span class="toggle-slider"></span>
                </label>
                <span class="permission-label">Verified List</span>
            </div>
        </div>
    </div>
    
    <!-- ID Card Actions -->
    <div class="permission-category">
        <div class="category-title">
            <i class="fa-solid fa-bolt"></i> ID Card Actions
        </div>
        <div class="permissions-grid">
            <div class="permission-row">
                <label class="toggle-switch">
                    <input type="checkbox" name="perm_idcard_add" id="perm-idcard-add" checked>
                    <span class="toggle-slider"></span>
                </label>
                <span class="permission-label">Add Card</span>
            </div>
            <div class="permission-row">
                <label class="toggle-switch">
                    <input type="checkbox" name="perm_idcard_info" id="perm-idcard-info" checked>
                    <span class="toggle-slider"></span>
                </label>
                <span class="permission-label">View Details</span>
            </div>
        </div>
    </div>
    
    <!-- Other -->
    <div class="permission-category">
        <div class="category-title">
            <i class="fa-solid fa-ellipsis"></i> Other
        </div>
        <div class="permissions-grid">
            <div class="permission-row">
                <label class="toggle-switch">
                    <input type="checkbox" name="perm_mobile_app" id="perm-mobile-app" checked>
                    <span class="toggle-slider"></span>
                </label>
                <span class="permission-label">Mobile App Access</span>
            </div>
            <div class="permission-row">
                <label class="toggle-switch">
                    <input type="checkbox" name="perm_idcard_bulk_download" id="perm-idcard-bulk-download" checked>
                    <span class="toggle-slider"></span>
                </label>
                <span class="permission-label">Download PDF</span>
            </div>
        </div>
    </div>
</div>
