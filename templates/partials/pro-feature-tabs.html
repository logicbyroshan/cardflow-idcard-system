<div class="pro-feature-tabs" role="tablist" aria-label="Pro Feature Tabs">
  {# Impersonate User — visible to pro_user, super_admin, and admin_staff #}
  {% if perm_pro_user_options or is_pro_user or is_super_admin %}
  <a href="{% url 'login_as_user' %}" class="pro-feature-tab{% if pro_tab == 'user_options' or pro_tab == 'login_as_user' or pro_tab == 'pro_user_activity_logs' %} active{% endif %}" role="tab" aria-selected="{% if pro_tab == 'user_options' or pro_tab == 'login_as_user' or pro_tab == 'pro_user_activity_logs' %}true{% else %}false{% endif %}">
    <i class="fa-solid fa-user-gear"></i> Impersonate User
  </a>
  {% endif %}



  {# Guest Users — visible to pro_user and super_admin #}
  {% if is_pro_user or is_super_admin %}
  <a href="{% url 'pro_user_guest_users' %}" class="pro-feature-tab{% if pro_tab == 'pro_user_guest_users' %} active{% endif %}" role="tab" aria-selected="{% if pro_tab == 'pro_user_guest_users' %}true{% else %}false{% endif %}">
    <i class="fa-solid fa-user-secret"></i> Manage Guest Users
  </a>
  {% endif %}
</div>
