{% comment %}
Staff Drawer - Client Assignment Section
Partial for operator client assignment checklist (matching photographer assignment style).
{% endcomment %}

<!-- Client Assignment Section (Operator Only) -->
<div class="form-section" id="client-assignment-section" style="display: none;">
    <h3 class="section-title">
        <i class="fa-solid fa-building-user"></i> Client Assignment
    </h3>
    <div class="form-group">
        <label class="form-label">Assign Clients</label>
        
        <!-- Sticky Search Bar -->
        <div style="position: sticky; top: 0; background: #fff; z-index: 10; padding-bottom: 8px; border-bottom: 1px solid var(--color-slate-100); margin-bottom: 8px;">
            <div style="border: 1px solid var(--color-slate-200); border-radius: 6px; padding: 6px 12px; display: flex; align-items: center; gap: 8px; background: #f8fafc;">
                <i class="fa-solid fa-magnifying-glass" style="color: var(--color-slate-400); font-size: 13px;"></i>
                <input type="text" id="client-search-input" placeholder="Search clients..." autocomplete="off" style="border: none; background: transparent; font-size: 13px; outline: none; width: 100%; color: var(--color-slate-800);">
            </div>
        </div>

        <div class="operator-client-assignment-container" id="client-assignment-list" style="border: 1px solid var(--color-slate-200); border-radius: 6px; padding: 12px; background: #fff; max-height: 250px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;">
            <!-- Client checkbox rows will be populated dynamically -->
        </div>
        
        <div class="client-multiselect-empty" id="client-multiselect-empty" style="display: none; text-align: center; color: var(--color-slate-400); padding: 12px; font-size: 13px;">
            No clients found
        </div>
        <small class="field-hint">Check one or more clients this staff can manage.</small>
    </div>
    
    <!-- Chips list for selected clients -->
    <div class="client-chips-section" style="margin-top: 16px;">
        <label class="form-label" style="font-size: 12px; color: var(--color-slate-500); font-weight: 600;">Currently Assigned Clients:</label>
        <div id="client-selected-chips-container" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px;">
            <!-- Chips will be populated here -->
        </div>
    </div>
</div>
