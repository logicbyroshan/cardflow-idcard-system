{% load static %}

<!-- Confirmation Modal -->
<div class="modal-backdrop" id="confirmModal">
  <div class="modal-center modal-danger">
    <div class="modal-header">
      <h3 id="confirmTitle"><i class="fa-solid fa-triangle-exclamation"></i> Confirm Action</h3>
      <button class="modal-close" onclick="closeConfirmModal()" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" style="display:flex;flex-direction:column;align-items:center;text-align:center;">
      <div style="width:52px;height:52px;border-radius:50%;background:#fee2e2;display:flex;align-items:center;justify-content:center;margin-bottom:14px" id="confirmIconWrap">
        <i class="fa-solid fa-triangle-exclamation" style="font-size:22px;color:#ef4444" id="confirmIconEl"></i>
      </div>
      <p id="confirmMessage" style="font-size:13px;color:#374151;margin:0 0 14px;line-height:1.6"></p>
      <div style="width:100%;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:10px 14px;text-align:left" id="confirmWarningBox">
        <p style="font-size:12px;color:#991b1b;font-weight:600;margin:0 0 6px;display:flex;align-items:center;gap:6px">
          <i class="fa-solid fa-circle-exclamation"></i> Warning
        </p>
        <ul style="margin:0;padding:0 0 0 16px;font-size:12px;color:#7f1d1d;line-height:1.7">
          <li>This action may affect the staff member's data</li>
          <li>Please confirm before proceeding</li>
        </ul>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-md btn-neutral" onclick="closeConfirmModal()"><i class="fa-solid fa-xmark"></i> Cancel</button>
      <button type="button" class="btn btn-md btn-danger" id="confirmBtn" onclick="executeConfirmAction()"><i class="fa-solid fa-check"></i> Confirm</button>
    </div>
  </div>
</div>
