{% load static %}

<!-- Create/Edit Staff Modal -->
<div class="modal-overlay" id="staffModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">Add Admin Staff</h3>
      <button class="modal-close" onclick="closeModal()" aria-label="Close">&times;</button>
    </div>
    <form id="staffForm" onsubmit="handleSubmit(event)">
      <input type="hidden" id="staffId" value="">
      
      <div class="form-row">
        <div class="form-group">
          <label for="firstName">First Name *</label>
          <input type="text" id="firstName" name="first_name" required>
        </div>
        <div class="form-group">
          <label for="lastName">Last Name *</label>
          <input type="text" id="lastName" name="last_name" required>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email *</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone">
        </div>
        <div class="form-group">
          <label for="designation">Designation</label>
          <input type="text" id="designation" name="designation" value="Staff">
        </div>
      </div>

      <div class="form-group">
        <label for="department">Department</label>
        <input type="text" id="department" name="department">
      </div>

      <div class="form-group">
        <label>Assigned Clients</label>
        <div class="client-select-grid" id="clientsContainer">
          <!-- Populated by JS -->
        </div>
      </div>

      <div class="form-group">
        <label>Permissions</label>
        <div id="permissionsContainer">
          <!-- Client Management -->
          <div class="permission-category">
            <h4><i class="fa-solid fa-users"></i> Client Management</h4>
            <div class="permission-grid" id="clientPermissions"></div>
          </div>

          <!-- ID Card Data -->
          <div class="permission-category">
            <h4><i class="fa-solid fa-id-card"></i> ID Card Data</h4>
            <div class="permission-grid" id="idcardPermissions"></div>
          </div>

          <!-- Settings & Bulk -->
          <div class="permission-category">
            <h4><i class="fa-solid fa-cog"></i> Settings & Operations</h4>
            <div class="permission-grid" id="settingsPermissions"></div>
          </div>
        </div>
      </div>

      <div class="btn-group">
        <button type="button" class="btn btn-md btn-neutral" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-md btn-primary" id="submitBtn">Create Staff</button>
      </div>
    </form>
  </div>
</div>
