<!-- Delete All Confirmation Modal -->
<div id="deleteAllModal" class="center-modal-overlay center-modal-theme-red"
     x-show="activeModal === 'deleteAll'" x-transition.opacity
     style="display:none">
  <div class="center-modal-card" @click.stop
       x-show="activeModal === 'deleteAll'" x-transition.scale.origin.center>
    <div class="center-modal-icon">
      <i class="fa-solid fa-triangle-exclamation"></i>
    </div>
    <h3 class="center-modal-title">Delete All ID Cards</h3>
    <p class="center-modal-subtitle">
      Table: <strong id="deleteAllTableName"></strong>
    </p>
    <p class="center-modal-subtitle">
      This will permanently delete <strong id="deleteAllCount"></strong> cards from <strong>ALL lists</strong> (Pending, Verified, Approved, Download, Pool).
    </p>
    <p class="center-modal-warning">This action CANNOT be undone.</p>
    <p class="center-modal-label">Enter the 6-digit code below to confirm:</p>
    <div class="center-modal-code" id="deleteAllCode"></div>
    <input type="text" id="deleteAllCodeInput" class="center-modal-input" maxlength="6" placeholder="Enter code here">
    <div class="center-modal-actions">
      <button id="deleteAllCancel" class="center-modal-btn center-modal-btn-cancel" @click="closeModal()">Cancel</button>
      <button id="deleteAllConfirm" class="center-modal-btn center-modal-btn-confirm" disabled>Delete All Cards</button>
    </div>
  </div>
</div>
