<!-- Delete All Confirmation Modal (Dashboard) -->
<div id="dashDeleteAllModal" class="modal-backdrop"
     x-show="activeModal === 'dashDelete'" x-transition.opacity
     style="display:none">
  <div class="modal-center modal-danger" @click.stop
       x-show="activeModal === 'dashDelete'" x-transition.scale.origin.center>
    <div class="modal-header">
      <h3><i class="fa-solid fa-triangle-exclamation"></i> Delete All ID Cards</h3>
      <button type="button" class="modal-close" @click="closeModal()" aria-label="Close">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="modal-body">
      <div class="flex flex-col items-center text-center py-2">
        <div class="w-10 h-10 rounded-sm bg-danger-bg flex items-center justify-center mb-2">
          <i class="fa-solid fa-triangle-exclamation text-danger text-sm"></i>
        </div>
        <p class="text-sm text-gray-600 mb-1">Table: <strong id="dashDeleteTableName"></strong></p>
        <p class="text-sm text-gray-600 mb-1">This will permanently delete <strong id="dashDeleteCount"></strong> cards from <strong>ALL lists</strong>.</p>
        <p class="text-xs text-danger font-semibold mb-2">This action CANNOT be undone.</p>
        <p class="text-sm text-gray-700 mb-1">Enter the 6-digit code below to confirm:</p>
        <div class="bg-danger-bg border-2 border-danger-light text-danger font-bold mb-2 px-2 py-1 text-lg tracking-widest rounded-sm" id="dashDeleteCode"></div>
        <input type="text" id="dashDeleteCodeInput" maxlength="6" placeholder="Enter code here" class="form-input text-center font-semibold mb-2 w-44 tracking-wider text-xs">
      </div>
    </div>
    <div class="modal-footer">
      <button id="dashDeleteCancel" class="btn btn-md btn-neutral" type="button"
              @click="closeModal()">Cancel</button>
      <button id="dashDeleteConfirm" class="btn btn-md btn-danger" type="button" disabled>Delete All Cards</button>
    </div>
  </div>
</div>
