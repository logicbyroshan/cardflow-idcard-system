<!-- Upgrade All Classes Confirmation Modal (Dashboard) -->
<div id="dashUpgradeAllModal" class="modal-backdrop"
     x-show="activeModal === 'dashUpgrade'" x-transition.opacity
     style="display:none">
  <div class="modal-center modal-warning" @click.stop
       x-show="activeModal === 'dashUpgrade'" x-transition.scale.origin.center>
    <div class="modal-header">
      <h3><i class="fa-solid fa-arrow-up"></i> Upgrade All Classes</h3>
      <button type="button" class="modal-close" @click="closeModal()" aria-label="Close">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="modal-body">
      <div class="modal-body-center">
        <div class="modal-icon-circle modal-icon-warning">
          <i class="fa-solid fa-arrow-up modal-icon-i-warning"></i>
        </div>
        <p class="modal-body-title">Upgrade All Classes</p>
        <p class="modal-body-subtitle" style="margin-bottom:4px">Table: <strong id="dashUpgradeTableName" class="text-gray-800"></strong></p>
        <p class="modal-body-subtitle">This will upgrade the class value of <strong id="dashUpgradeCount" class="text-gray-800"></strong> cards in the <strong>Download list</strong> to the next level (e.g. V &rarr; VI).</p>
        <div class="modal-alert modal-alert-warning" style="margin-bottom:16px;">
          <p class="modal-alert-title">
            <i class="fa-solid fa-circle-exclamation"></i> Warning
          </p>
          <ul>
            <li>This action <strong>CANNOT</strong> be undone</li>
            <li>All cards in the Download list will be upgraded</li>
          </ul>
        </div>
        <!-- 10-digit confirmation code -->
        <div style="width:100%;">
          <p class="confirm-code-hint">Type this code to confirm:</p>
          <div id="dashUpgradeCode" class="confirm-code-display confirm-code-display-warning">----------</div>
          <input type="text" id="dashUpgradeCodeInput"
              maxlength="10"
              inputmode="numeric"
              pattern="[0-9]{10}"
              placeholder="_ _ _ _ _ _ _ _ _ _"
              autocomplete="off"
              class="confirm-code-input"
              oninput="this.value=this.value.replace(/[^0-9]/g,'')"
          >
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button id="dashUpgradeCancel" class="btn btn-md btn-neutral" type="button"
              @click="closeModal()"><i class="fa-solid fa-xmark"></i> Cancel</button>
      <button id="dashUpgradeConfirm" class="btn btn-md btn-warning" type="button" disabled><i class="fa-solid fa-arrow-up"></i> Upgrade All Classes</button>
    </div>
  </div>
</div>
