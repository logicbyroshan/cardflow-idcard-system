<!-- Recent Activity -->
<div class="dashboard-card">
  <div class="dashboard-card-header">
    <h3><i class="fa-solid fa-history"></i> Recent Activity</h3>
  </div>
  <div class="dashboard-card-body tall-body">
    <div class="activity-list" id="recentActivityList">
      {% if recent_activities %}
        {% for activity in recent_activities %}
        <div class="activity-item">
          <div class="activity-icon {{ activity.icon_color }}">
            <i class="fa-solid {{ activity.icon_class }}"></i>
          </div>
          <div class="activity-content">
            <div class="activity-text">{{ activity.display_text|default:activity.description }}</div>
            <div class="activity-time">{{ activity.time_ago }} ago</div>
          </div>
        </div>
        {% endfor %}
      {% else %}
        <div class="activity-item" id="noActivityMessage">
          <div class="activity-icon edit">
            <i class="fa-solid fa-circle-info"></i>
          </div>
          <div class="activity-content">
            <div class="activity-text">No recent activity to show</div>
            <div class="activity-time">Activity will appear here as actions are performed</div>
          </div>
        </div>
      {% endif %}
    </div>
  </div>
</div>
