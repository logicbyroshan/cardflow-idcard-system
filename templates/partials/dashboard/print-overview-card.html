{% comment %}
Print Overview Card - Admin Dashboard
Loaded dynamically via api_print_reprint_overview.
{% endcomment %}

<div class="dashboard-card">
  <div class="dashboard-card-header">
    <h3><i class="fa-solid fa-print"></i> Card Printing</h3>
    <a href="#" class="view-all" onclick="return false;">Print Cards <i class="fa-solid fa-arrow-right"></i></a>
  </div>
  <div class="dashboard-card-body tall-body p-0 table-scroll-body">
    <div class="recent-table-wrapper dashboard-scroll-table-wrapper">
      <table class="recent-table dashboard-scroll-table recent-table-3col">
        <thead>
          <tr>
            <th scope="col">Client</th>
            <th scope="col" class="text-center">Generate List</th>
            <th scope="col" class="text-center">Finalized</th>
          </tr>
        </thead>
        <tbody id="printOverviewBody">
          <tr class="dashboard-table-skeleton-row">
            <td><span class="dash-skeleton dash-skeleton-line" style="width: 76%;"></span></td>
            <td><span class="dash-skeleton dash-skeleton-pill"></span></td>
            <td><span class="dash-skeleton dash-skeleton-pill"></span></td>
          </tr>
          <tr class="dashboard-table-skeleton-row">
            <td><span class="dash-skeleton dash-skeleton-line" style="width: 68%;"></span></td>
            <td><span class="dash-skeleton dash-skeleton-pill"></span></td>
            <td><span class="dash-skeleton dash-skeleton-pill"></span></td>
          </tr>
          <tr class="dashboard-table-skeleton-row">
            <td><span class="dash-skeleton dash-skeleton-line" style="width: 72%;"></span></td>
            <td><span class="dash-skeleton dash-skeleton-pill"></span></td>
            <td><span class="dash-skeleton dash-skeleton-pill"></span></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
