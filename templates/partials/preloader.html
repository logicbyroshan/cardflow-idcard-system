{% load static %}
<div id="appPreloader" class="app-preloader" style="display: none;">
  <!-- Premium Fluid Ambient Glow Blobs -->
  <div class="preloader-bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <div class="preloader-content">
    <div class="preloader-logo-wrap" id="preloaderLogoWrap">
      <img src="{% static 'assets/logo.webp' %}" alt="Logo" class="preloader-logo" id="preloaderLogo">
    </div>
    <div class="preloader-title" id="preloaderTitle"></div>
    <div class="preloader-welcome" id="preloaderWelcome">
      <span class="welcome-text">Welcome</span>
      <span class="user-name">{{ request.user.get_full_name|default:request.user.username|default:"User" }}</span>
    </div>
  </div>
</div>

<style>
  .app-preloader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 999999;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #080512; /* Deeper midnight black base */
    opacity: 1;
    transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.6s ease;
    overflow: hidden;
  }

  .preloader-bg-blobs {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    filter: blur(110px);
    opacity: 0.75;
    pointer-events: none;
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    mix-blend-mode: screen;
    will-change: transform;
  }

  /* Deep Royal Violet Blob */
  .blob-1 {
    top: -10%;
    left: -10%;
    width: 65%;
    height: 65%;
    background: radial-gradient(circle, rgba(124, 58, 237, 0.55) 0%, rgba(124, 58, 237, 0) 70%);
    animation: fluidBlob1 20s ease-in-out infinite alternate;
  }

  /* Vibrant Magenta Rose Blob */
  .blob-2 {
    bottom: -15%;
    right: -10%;
    width: 75%;
    height: 75%;
    background: radial-gradient(circle, rgba(219, 39, 119, 0.45) 0%, rgba(219, 39, 119, 0) 70%);
    animation: fluidBlob2 24s ease-in-out infinite alternate;
  }

  /* Glowing Indigo/Neon Blue Blob */
  .blob-3 {
    top: 25%;
    right: 15%;
    width: 55%;
    height: 55%;
    background: radial-gradient(circle, rgba(79, 70, 229, 0.55) 0%, rgba(79, 70, 229, 0) 70%);
    animation: fluidBlob3 17s ease-in-out infinite alternate;
  }

  /* Soft Lavender Spark Accent */
  .blob-4 {
    bottom: 10%;
    left: 20%;
    width: 50%;
    height: 50%;
    background: radial-gradient(circle, rgba(192, 132, 252, 0.4) 0%, rgba(192, 132, 252, 0) 70%);
    animation: fluidBlob4 14s ease-in-out infinite alternate;
  }

  @keyframes fluidBlob1 {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(12%, 8%) scale(1.1); }
    100% { transform: translate(-8%, 18%) scale(0.95); }
  }

  @keyframes fluidBlob2 {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-18%, -12%) scale(0.9); }
    100% { transform: translate(8%, -8%) scale(1.15); }
  }

  @keyframes fluidBlob3 {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-12%, 12%) scale(1.15); }
    100% { transform: translate(-22%, -8%) scale(0.9); }
  }

  @keyframes fluidBlob4 {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(22%, -18%) scale(1.1); }
    100% { transform: translate(-12%, 8%) scale(0.95); }
  }

  .preloader-content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 250px;
    width: 100%;
  }

  .preloader-logo-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 110px;
    height: 110px;
    transition: transform 2.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    opacity: 1;
  }

  .preloader-logo {
    width: 100px;
    height: 100px;
    object-fit: contain;
    filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.5));
  }

  .preloader-title {
    margin-top: 12px;
    font-family: 'Outfit', 'Inter', sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 0.04em;
    min-height: 40px;
    text-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    transition: opacity 0.4s ease, transform 0.4s ease;
    opacity: 1;
  }

  .preloader-welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    opacity: 0;
    transform: scale(0.92);
    transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    position: absolute;
    width: 100%;
    pointer-events: none;
  }

  .preloader-welcome .welcome-text {
    font-size: 14px;
    text-transform: uppercase;
    color: #c084fc;
    letter-spacing: 0.2em;
    font-weight: 700;
    font-family: 'Outfit', 'Inter', sans-serif;
  }

  .preloader-welcome .user-name {
    font-size: 32px;
    font-weight: 800;
    color: #ffffff;
    font-family: 'Outfit', 'Inter', sans-serif;
    letter-spacing: 0.02em;
    text-shadow: 0 4px 20px rgba(139, 92, 246, 0.5);
    text-align: center;
    padding: 0 20px;
  }
</style>

<script>
  (function() {
    // Check if the preloader has already been shown in this browser session
    const preloaderShown = sessionStorage.getItem('preloader_shown');
    
    // Only show preloader on very first visit (when flag is not set yet)
    // On refresh, back/forward, or navigating within the app — skip it
    if (!preloaderShown) {
        // Set flag immediately so refresh or next navigation won't show it again
        sessionStorage.setItem('preloader_shown', 'true');
        
        const preloader = document.getElementById('appPreloader');
        if (preloader) {
            preloader.style.display = 'flex';
        }
        
        // Run preloader animations on DOM load
        document.addEventListener('DOMContentLoaded', function() {
            const logoWrap = document.getElementById('preloaderLogoWrap');
            const titleEl = document.getElementById('preloaderTitle');
            const welcomeEl = document.getElementById('preloaderWelcome');
            const preloaderEl = document.getElementById('appPreloader');
            
            if (!logoWrap || !titleEl || !welcomeEl || !preloaderEl) return;
            
            setTimeout(function() {
                logoWrap.style.transform = 'translateY(-12px)';
                
                const text = "Adarsh ID Panel";
                let charIdx = 0;
                function typeText() {
                    if (charIdx < text.length) {
                        titleEl.textContent += text.charAt(charIdx);
                        charIdx++;
                        setTimeout(typeText, 50);
                    } else {
                        setTimeout(function() {
                            logoWrap.style.opacity = '0';
                            logoWrap.style.transform = 'translateY(-55px) scale(0.85)';
                            titleEl.style.opacity = '0';
                            titleEl.style.transform = 'translateY(-15px)';
                            
                            setTimeout(function() {
                                logoWrap.style.display = 'none';
                                titleEl.style.display = 'none';
                                
                                welcomeEl.style.opacity = '1';
                                welcomeEl.style.transform = 'scale(1)';
                                
                                setTimeout(function() {
                                    preloaderEl.style.opacity = '0';
                                    setTimeout(function() {
                                        preloaderEl.style.display = 'none';
                                    }, 600);
                                }, 1500);
                            }, 300);
                        }, 300);
                    }
                }
                typeText();
            }, 300);
        });
    }
  })();
</script>
