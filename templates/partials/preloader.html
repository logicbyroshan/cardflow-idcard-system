{% load static %}
<div id="appPreloader" class="app-preloader">
  <div class="preloader-content">
    <div class="preloader-logo-wrap" id="preloaderLogoWrap">
      <img src="{% static 'assets/logo.png' %}" alt="Logo" class="preloader-logo" id="preloaderLogo">
    </div>
    <div class="preloader-title" id="preloaderTitle"></div>
    <div class="preloader-welcome" id="preloaderWelcome">
      <span class="welcome-text">Welcome</span>
      <span class="user-name">{{ request.user.get_full_name|default:request.user.username|default:"User" }}</span>
    </div>
  </div>
</div>

<style>
  .app-preloader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 999999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(-45deg, #090514, #1b0c36, #3b0764, #120924);
    background-size: 400% 400%;
    animation: preloaderGradientBG 8s ease infinite;
    opacity: 1;
    transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.6s ease;
    overflow: hidden;
  }
  
  @keyframes preloaderGradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .preloader-content {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 250px;
    width: 100%;
  }

  .preloader-logo-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 110px;
    height: 110px;
    transition: transform 2.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    opacity: 1;
  }

  .preloader-logo {
    width: 100px;
    height: 100px;
    object-fit: contain;
    filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.3));
  }

  .preloader-title {
    margin-top: 24px;
    font-family: 'Outfit', 'Inter', sans-serif;
    font-size: 26px;
    font-weight: 700;
    color: #ffffff;
    letter-spacing: 0.04em;
    min-height: 40px;
    text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
    transition: opacity 0.4s ease, transform 0.4s ease;
    opacity: 1;
  }

  .preloader-welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    opacity: 0;
    transform: scale(0.92);
    transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    position: absolute;
    width: 100%;
    pointer-events: none;
  }

  .preloader-welcome .welcome-text {
    font-size: 14px;
    text-transform: uppercase;
    color: #c084fc;
    letter-spacing: 0.2em;
    font-weight: 700;
    font-family: 'Outfit', 'Inter', sans-serif;
  }

  .preloader-welcome .user-name {
    font-size: 32px;
    font-weight: 800;
    color: #ffffff;
    font-family: 'Outfit', 'Inter', sans-serif;
    letter-spacing: 0.02em;
    text-shadow: 0 4px 16px rgba(139, 92, 246, 0.4);
    text-align: center;
    padding: 0 20px;
  }
</style>

<script>
  (function() {
    // Determine navigation type BEFORE any DOM manipulation
    var navType = 'navigate';
    try {
      if (performance.getEntriesByType) {
        var navEntry = performance.getEntriesByType('navigation')[0];
        if (navEntry) navType = navEntry.type;
      } else if (performance.navigation) {
        navType = performance.navigation.type === 1 ? 'reload' : 'navigate';
      }
    } catch(e) {}

    var isReload    = (navType === 'reload');
    var isBackForward = (navType === 'back_forward');
    var preloaderShown = sessionStorage.getItem('preloader_shown');

    // Decide: should we skip the preloader?
    // Skip only if same session AND not a reload AND not back/forward
    var skip = preloaderShown && !isReload && !isBackForward;

    if (skip) {
      // Hide before first paint so there is zero flash
      var style = document.createElement('style');
      style.textContent = '#appPreloader{display:none!important}';
      (document.head || document.documentElement).appendChild(style);
    } else {
      // Mark shown for this session
      sessionStorage.setItem('preloader_shown', 'true');

      // Run animation after DOM is ready
      function runPreloader() {
        var logoWrap  = document.getElementById('preloaderLogoWrap');
        var titleEl   = document.getElementById('preloaderTitle');
        var welcomeEl = document.getElementById('preloaderWelcome');
        var preloader = document.getElementById('appPreloader');

        if (!logoWrap || !titleEl || !welcomeEl || !preloader) return;

        // Step 1: slide logo up & type brand name
        setTimeout(function() {
          logoWrap.style.transform = 'translateY(-35px)';

          var text = 'Adarsh ID Panel';
          var charIdx = 0;
          function typeText() {
            if (charIdx < text.length) {
              titleEl.textContent += text.charAt(charIdx++);
              setTimeout(typeText, 70);
            } else {
              // Step 2: fade logo + title out
              setTimeout(function() {
                logoWrap.style.opacity = '0';
                logoWrap.style.transform = 'translateY(-55px) scale(0.85)';
                titleEl.style.opacity = '0';
                titleEl.style.transform = 'translateY(-15px)';

                // Step 3: show welcome message
                setTimeout(function() {
                  logoWrap.style.display = 'none';
                  titleEl.style.display  = 'none';
                  welcomeEl.style.opacity   = '1';
                  welcomeEl.style.transform = 'scale(1)';

                  // Step 4: fade out whole preloader
                  setTimeout(function() {
                    preloader.style.opacity = '0';
                    setTimeout(function() {
                      preloader.style.display = 'none';
                    }, 600);
                  }, 1500);
                }, 350);
              }, 500);
            }
          }
          typeText();
        }, 400);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', runPreloader);
      } else {
        // DOM already parsed (script ran late) — still run the animation
        runPreloader();
      }
    }
  })();
</script>
