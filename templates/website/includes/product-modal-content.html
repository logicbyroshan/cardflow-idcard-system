<div class="product-modal-content">
    <div class="product-modal-body">
        <div class="product-modal-media">
            {% if item.item_type == 'image' %}
                <img src="{{ item.image.url }}" alt="{{ item.title }}" class="modal-main-image">
            {% elif item.item_type == 'video' %}
                <video controls poster="{{ item.video_thumbnail_url }}" class="modal-main-video">
                    <source src="{{ item.video_source_url }}" type="video/mp4">
                </video>
            {% endif %}
        </div>
        <div class="product-modal-info">
            <nav class="modal-breadcrumb" aria-label="Breadcrumb">
                <ol class="breadcrumb">
                    {% for crumb in breadcrumb %}
                        <li class="breadcrumb-item {% if forloop.last %}active{% endif %}">
                            {{ crumb.name }}
                        </li>
                    {% endfor %}
                </ol>
            </nav>
            <h1>{{ item.title }}</h1>
            <p class="category-badge">{{ item.category.name }}</p>
            <div class="modal-description">
                {{ item.description|linebreaks }}
            </div>
            <div class="modal-actions">
                <a href="{% url 'website:home' %}#contact" class="btn-cta">Get Quote</a>
                <button type="button" class="btn-share" id="modalShareBtn" data-url="{{ request.scheme }}://{{ request.get_host }}{% url 'website:product_detail' item.category.slug item.slug %}">
                    <i class="fa-solid fa-share-nodes"></i> Copy Link
                </button>
            </div>
        </div>
    </div>
</div>

<style>
.product-modal-body { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; padding: 2rem; }
.modal-main-image, .modal-main-video { width: 100%; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
.modal-breadcrumb .breadcrumb { display: flex; list-style: none; padding: 0; font-size: 0.8rem; gap: 0.4rem; margin-bottom: 1rem; opacity: 0.7; }
.modal-breadcrumb .breadcrumb-item + .breadcrumb-item::before { content: "/"; color: #ccc; margin-right: 0.4rem; }
.modal-description { font-size: 1rem; line-height: 1.6; color: #555; margin: 1.5rem 0; }
.modal-actions { display: flex; gap: 1rem; margin-top: 2rem; }
.btn-share { background: #f0f2f5; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: all 0.2s; }
.btn-share:hover { background: #e4e6e9; }
.btn-share.copied { background: #2ecc71; color: #fff; }
@media (max-width: 768px) {
    .product-modal-body { grid-template-columns: 1fr; padding: 1.5rem; }
}
</style>
