<div id="bulkUploadAssistantsModal" class="modal-backdrop" style="display:none"
     x-show="activeModal === 'bulkUpload'" x-transition.opacity
     role="dialog" aria-modal="true">
    <div class="modal-center modal-compact" @click.stop
         x-show="activeModal === 'bulkUpload'" x-transition.scale.origin.center>
        <div class="modal-header">
            <h3><i class="fa-solid fa-file-excel text-success"></i> Bulk Add Assistants</h3>
            <button class="modal-close" type="button" aria-label="Close modal" @click="closeModal()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="modal-body bg-slate-50/50">
            <div class="bg-blue-50 border-l-4 border-blue-500 p-3 mb-4 rounded-r-md">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <i class="fa-solid fa-circle-info text-blue-500"></i>
                    </div>
                    <div class="ml-3">
                        <p class="text-xs text-blue-700">
                            Upload an Excel (.xlsx) file containing <strong>Name</strong>, <strong>Email</strong>, and <strong>Password</strong> columns. Phone is optional.
                        </p>
                    </div>
                </div>
            </div>

            <form id="bulkUploadAssistantsForm">
                <div class="form-group w-full">
                    <div id="bulkUploadDropzone" class="border-2 border-dashed border-slate-300 rounded-lg p-8 text-center cursor-pointer hover:bg-slate-50 hover:border-primary transition-colors bg-white">
                        <i class="fa-solid fa-cloud-arrow-up text-4xl text-slate-400 mb-3" id="bulkUploadDropIcon"></i>
                        <h4 class="text-base font-semibold text-slate-700 mb-1" id="bulkUploadDropText">Click to select or drag and drop</h4>
                        <p class="text-xs text-slate-500" id="bulkUploadDropSub">Excel files only (.xlsx, .xls)</p>
                        <div id="bulkUploadFileName" class="mt-3 text-sm font-medium text-success hidden">
                            <i class="fa-solid fa-file-excel mr-1"></i> <span id="bulkUploadFileNameText"></span>
                        </div>
                    </div>
                    <input type="file" id="bulkUploadAssistantsInput" accept=".xlsx, .xls" class="hidden">
                </div>
            </form>
        </div>
        <div class="modal-footer bg-white border-t border-slate-200">
            <button type="button" class="btn btn-md btn-neutral" @click="closeModal()">
                Cancel
            </button>
            <button type="button" class="btn btn-md btn-success" id="bulkUploadSubmitBtn" disabled>
                <i class="fa-solid fa-upload"></i> Upload & Process
            </button>
        </div>
    </div>
</div>
