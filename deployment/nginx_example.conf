# Nginx Configuration for Adarsh Admin
# =====================================
# 
# Production: 2GB RAM server, 2 Gunicorn workers
# - Large client_max_body_size for bulk uploads (1000MB)
# - Long timeouts for background processing (600s)
# - Efficient buffering settings
# - HTTP/2 + Brotli + immutable caching for static assets
#
# Prerequisites:
#   sudo apt install libnginx-mod-http-brotli-filter libnginx-mod-http-brotli-static
#   # OR on older Ubuntu: nginx-module-brotli
#
# Installation:
#   sudo cp nginx.conf /etc/nginx/sites-available/adarsh
#   sudo ln -s /etc/nginx/sites-available/adarsh /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx

upstream django_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # CRITICAL: Allow large file uploads (up to 1GB)
    # Without this, Nginx rejects uploads >1MB with HTTP 413, causing
    # XHR uploads to silently stall at 0% with no error visible to the user.
    # ALL upload features (reupload images, portfolio bulk upload, bulk XLSX+ZIP)
    # require this setting.
    client_max_body_size 1000M;
    
    # Increase buffer sizes for large requests
    client_body_buffer_size 128k;
    
    # CRITICAL: Long timeouts for bulk operations
    proxy_read_timeout 600;
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    
    # Timeouts for backend
    send_timeout 600;
    keepalive_timeout 600;
    
    # Increase body temp file size
    client_body_temp_path /tmp/nginx_body 1 2;
    
    # Gzip compression for responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/font-woff2 font/woff2;
    gzip_min_length 256;

    # Brotli compression (better than gzip, ~15-20% smaller)
    # Requires: libnginx-mod-http-brotli-filter
    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/font-woff2 font/woff2;
    brotli_min_length 256;
    # Serve pre-compressed .br files if Whitenoise generated them
    brotli_static on;

    # Static files — long immutable cache (content-hashed by ManifestStaticFilesStorage)
    location /static/ {
        alias /path/to/project/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Serve gzip/brotli pre-compressed files from Whitenoise
        gzip_static on;
    }

    # Font files — extra long cache + CORS for font loading
    location ~* \.(?:woff2?|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Media files (public: website images, adarshimg, etc.)
    location /media/ {
        alias /path/to/project/media/;
        expires 7d;
        
        # Large file serving settings
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
    }

    # SECURITY: Single internal location for all auth-gated media.
    # Django checks authentication, then sets X-Accel-Redirect: /protected-media/<path>.
    # Nginx resolves the alias to MEDIA_ROOT/<path> and streams it directly to the
    # client — completely bypassing the Django/Gunicorn worker for the file transfer.
    #
    # The `internal` directive makes this location unreachable from the browser;
    # ONLY responses that carry an X-Accel-Redirect header from upstream can trigger it.
    # A direct GET /protected-media/... from a browser always gets 404.
    location /protected-media/ {
        internal;
        alias /path/to/project/media/;
        sendfile on;
        sendfile_max_chunk 1m;
    }

    # API endpoints
    location /api/ {
        proxy_pass http://django_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Keep connection alive for long operations
        proxy_set_header Connection "";
        
        # CRITICAL: Long timeouts for bulk upload/export APIs
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        
        # Disable buffering for progress streaming
        # (Enable this if using streaming responses)
        # proxy_buffering off;
    }

    # Django application
    location / {
        proxy_pass http://django_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Health check endpoint (quick response)
    location /api/health/ {
        proxy_pass http://django_app;
        proxy_read_timeout 10;
        proxy_connect_timeout 5;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/adarsh_access.log;
    error_log /var/log/nginx/adarsh_error.log;
}

