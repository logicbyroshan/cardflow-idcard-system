# Nginx Configuration — Subdomain Split
# =======================================
#
# Two server blocks, one Gunicorn upstream:
#   www.adarshbhopal.in   → public website
#   panel.adarshbhopal.in → admin panel + PWA
#
# Prerequisites:
#   sudo apt install libnginx-mod-http-brotli-filter libnginx-mod-http-brotli-static
#   sudo certbot --nginx -d www.adarshbhopal.in -d panel.adarshbhopal.in -d adarshbhopal.in
#
# Installation:
#   sudo cp nginx_subdomain.conf /etc/nginx/sites-available/adarsh
#   sudo ln -s /etc/nginx/sites-available/adarsh /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream django_app {
    server 127.0.0.1:8000;
    keepalive 32;
}


# =============================================================================
# PUBLIC WEBSITE — www.adarshbhopal.in
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.adarshbhopal.in adarshbhopal.in;

    ssl_certificate /etc/letsencrypt/live/www.adarshbhopal.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.adarshbhopal.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Website doesn't need large uploads
    client_max_body_size 10M;

    # Reasonable timeouts for a public website
    proxy_read_timeout 30;
    proxy_connect_timeout 10;
    proxy_send_timeout 30;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml
               application/xml application/xml+rss text/javascript image/svg+xml
               application/font-woff2 font/woff2;
    gzip_min_length 256;

    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css application/json application/javascript text/xml
                 application/xml application/xml+rss text/javascript image/svg+xml
                 application/font-woff2 font/woff2;
    brotli_min_length 256;
    brotli_static on;

    # Static files (content-hashed by WhiteNoise — immutable cache)
    location /static/ {
        alias /path/to/project/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip_static on;
    }

    # Font files — CORS for font loading
    location ~* \.(?:woff2?|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Public media only (portfolio images, logos, hero images)
    location /media/adarshimg/ {
        alias /path/to/project/media/adarshimg/;
        expires 7d;
        sendfile on;
    }
    location /media/images/ {
        alias /path/to/project/media/images/;
        expires 7d;
        sendfile on;
    }

    # Block protected media on the public site
    location /media/exports/   { return 404; }
    location /media/clients_imgs/ { return 404; }
    location /media/staff_imgs/   { return 404; }
    location /media/temp/         { return 404; }

    # Django application
    location / {
        proxy_pass http://django_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Logging
    access_log /var/log/nginx/adarsh_www_access.log;
    error_log  /var/log/nginx/adarsh_www_error.log;
}


# =============================================================================
# ADMIN PANEL — panel.adarshbhopal.in
# =============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panel.adarshbhopal.in;

    ssl_certificate /etc/letsencrypt/live/www.adarshbhopal.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.adarshbhopal.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Large uploads (bulk XLSX + ZIP)
    client_max_body_size 1000M;
    client_body_buffer_size 128k;

    # Long timeouts for bulk operations
    proxy_read_timeout 600;
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    send_timeout 600;
    keepalive_timeout 600;

    client_body_temp_path /tmp/nginx_body 1 2;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml
               application/xml application/xml+rss text/javascript image/svg+xml
               application/font-woff2 font/woff2;
    gzip_min_length 256;

    brotli on;
    brotli_comp_level 6;
    brotli_types text/plain text/css application/json application/javascript text/xml
                 application/xml application/xml+rss text/javascript image/svg+xml
                 application/font-woff2 font/woff2;
    brotli_min_length 256;
    brotli_static on;

    # Static files
    location /static/ {
        alias /path/to/project/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip_static on;
    }

    # Font files
    location ~* \.(?:woff2?|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*";
    }

    # Public media
    location /media/ {
        alias /path/to/project/media/;
        expires 7d;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
    }

    # Protected media — only Django can serve these via X-Accel-Redirect
    # When MEDIA_USE_XACCEL=true in Django env, Django sends
    # X-Accel-Redirect: /protected-media/<path> for auth-gated files.
    # This unified internal block resolves that redirect to MEDIA_ROOT.
    location /protected-media/ {
        internal;
        alias /path/to/project/media/;
        sendfile on;
        sendfile_max_chunk 1m;
    }
    # Legacy per-directory internal blocks (kept for backward compatibility)
    location /media/exports/ {
        internal;
        alias /path/to/project/media/exports/;
        sendfile on;
        sendfile_max_chunk 1m;
    }
    location /media/clients_imgs/ {
        internal;
        alias /path/to/project/media/clients_imgs/;
        sendfile on;
    }
    location /media/staff_imgs/ {
        internal;
        alias /path/to/project/media/staff_imgs/;
        sendfile on;
    }
    location /media/temp/ {
        internal;
        alias /path/to/project/media/temp/;
        sendfile on;
    }

    # Panel API endpoints (long timeouts)
    location /panel/api/ {
        proxy_pass http://django_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
    }

    # Django application (panel + PWA + admin)
    location / {
        proxy_pass http://django_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Health check
    location /panel/api/health/ {
        proxy_pass http://django_app;
        proxy_read_timeout 10;
        proxy_connect_timeout 5;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Logging
    access_log /var/log/nginx/adarsh_panel_access.log;
    error_log  /var/log/nginx/adarsh_panel_error.log;
}


# =============================================================================
# HTTP → HTTPS REDIRECT (both subdomains)
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name www.adarshbhopal.in adarshbhopal.in panel.adarshbhopal.in;
    return 301 https://$host$request_uri;
}
