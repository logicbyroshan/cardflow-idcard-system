# Nginx Configuration for Adarsh Admin
# =====================================
# 
# CRITICAL for 1GB RAM server with bulk operations:
# - Large client_max_body_size for bulk uploads (1000MB)
# - Long timeouts for background processing (600s)
# - Efficient buffering settings
#
# Installation:
#   sudo cp nginx.conf /etc/nginx/sites-available/adarsh
#   sudo ln -s /etc/nginx/sites-available/adarsh /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx

upstream django_app {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;

    # CRITICAL: Allow large file uploads (up to 1GB)
    client_max_body_size 1000M;
    
    # Increase buffer sizes for large requests
    client_body_buffer_size 128k;
    
    # CRITICAL: Long timeouts for bulk operations
    proxy_read_timeout 600;
    proxy_connect_timeout 600;
    proxy_send_timeout 600;
    
    # Timeouts for backend
    send_timeout 600;
    keepalive_timeout 600;
    
    # Increase body temp file size
    client_body_temp_path /tmp/nginx_body 1 2;
    
    # Gzip compression for responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Static files
    location /static/ {
        alias /path/to/project/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Media files
    location /media/ {
        alias /path/to/project/media/;
        expires 7d;
        
        # Large file serving settings
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
    }

    # Export downloads (may be large)
    location /media/exports/ {
        alias /path/to/project/media/exports/;
        expires 1h;
        
        # Allow large file downloads
        sendfile on;
        sendfile_max_chunk 1m;
    }

    # API endpoints
    location /api/ {
        proxy_pass http://django_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Keep connection alive for long operations
        proxy_set_header Connection "";
        
        # CRITICAL: Long timeouts for bulk upload/export APIs
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        
        # Disable buffering for progress streaming
        # (Enable this if using streaming responses)
        # proxy_buffering off;
    }

    # Django application
    location / {
        proxy_pass http://django_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Health check endpoint (quick response)
    location /api/health/ {
        proxy_pass http://django_app;
        proxy_read_timeout 10;
        proxy_connect_timeout 5;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/adarsh_access.log;
    error_log /var/log/nginx/adarsh_error.log;
}

