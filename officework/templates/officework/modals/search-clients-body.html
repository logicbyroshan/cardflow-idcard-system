<div class="office-search-clients-intro" style="background: rgba(245, 158, 11, 0.05); padding: 12px; border-radius: 4px; margin-bottom: 20px; border: 1px solid rgba(245, 158, 11, 0.1);">
  <p style="margin: 0; font-size: 13px; color: #92400e;">Find potential clients by searching Google Maps for specific locations. Our scraper engine will collect lead data automatically.</p>
</div>

<div class="form-row">
  <div class="form-group">
    <label class="form-label" for="officeSearchDistrict">District</label>
    <input type="text" id="officeSearchDistrict" class="form-input" placeholder="e.g. Ahmedabad">
  </div>
  <div class="form-group">
    <label class="form-label" for="officeSearchTehsil">Tehsil / Taluka</label>
    <input type="text" id="officeSearchTehsil" class="form-input" placeholder="e.g. Sanand">
  </div>
</div>

<div class="office-search-status-box" id="officeSearchStatusBox" style="display: none; flex-direction: column; align-items: center; gap: 12px; padding: 30px; border: 1px dashed var(--color-primary); margin-top: 20px;">
  <div class="office-loader-spinner"></div>
  <p class="text-center" style="margin: 0; font-weight: 600;">Searching data on Google Maps...<br><small style="font-weight: 400; color: var(--color-slate-500);">This may take a few minutes.</small></p>
</div>
