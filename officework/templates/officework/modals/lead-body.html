<form id="officeLeadForm" class="office-lead-form">
  <input id="officeLeadEditId" type="hidden" value="">
  
  <div class="form-section">
    <div class="section-title"><i class="fa-solid fa-address-card"></i> Basic Contact Information</div>
    <div class="form-group">
      <label class="form-label" for="officeLeadName">Lead Name / Business Name <span class="required">*</span></label>
      <input id="officeLeadName" class="form-input" type="text" placeholder="e.g. John Doe / Apex Solutions" required>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="officeLeadContact">Phone Number</label>
        <input id="officeLeadContact" class="form-input" type="text" placeholder="Primary Contact">
      </div>
      <div class="form-group">
        <label class="form-label" for="officeLeadWhatsapp">WhatsApp</label>
        <input id="officeLeadWhatsapp" class="form-input" type="text" placeholder="WhatsApp Number">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label" for="officeLeadEmail">Email Address</label>
        <input id="officeLeadEmail" class="form-input" type="email" placeholder="Email">
      </div>
      <div class="form-group">
        <label class="form-label" for="officeLeadLocation">Location</label>
        <input id="officeLeadLocation" class="form-input" type="text" placeholder="City, State">
      </div>
    </div>
  </div>

  <div class="form-section">
    <div class="section-title"><i class="fa-solid fa-file-lines"></i> Additional Notes</div>
    <div class="form-group">
      <textarea id="officeLeadDescription" class="form-input" rows="5" placeholder="Additional details or special requirements..."></textarea>
    </div>
  </div>
</form>
