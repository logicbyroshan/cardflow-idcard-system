<div class="office-template-tabs" style="margin-bottom: 20px;">
  <button class="office-template-tab-btn is-active" data-template-type="whatsapp">WhatsApp</button>
  <button class="office-template-tab-btn" data-template-type="email">Email</button>
</div>

<div class="form-group">
  <div class="office-template-placeholder-info" style="margin-bottom: 12px;">
    <strong>Available Placeholders:</strong> 
    <code>{{customer_name}}</code>, <code>{{contact}}</code>, <code>{{email}}</code>, <code>{{location}}</code>
  </div>
  <label class="form-label">Template Content</label>
  <textarea id="officeTemplateText" class="form-input" rows="10" placeholder="Type your message template here..."></textarea>
</div>
